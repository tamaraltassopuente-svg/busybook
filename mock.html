<script>
/* ==================================================================
   MÓDULO COMÚN (SE REPETIRÁ IGUAL EN LOS 8 ARCHIVOS FINALES)
   ================================================================== */

/* --- VOZ: es-AR con fallback a es-ES / en-US --- */
const Voz = (() => {
  let voces = [];
  const cargar = () => { try{ voces = speechSynthesis.getVoices() || []; }catch(e){ voces = []; } };
  if ('speechSynthesis' in window){ cargar(); speechSynthesis.addEventListener('voiceschanged', cargar); }
  function elegir(prefs){
    for (const p of prefs){ const v = voces.find(v => v.lang.replace('_','-').toLowerCase() === p.toLowerCase()); if (v) return v; }
    for (const p of prefs){ const b = p.split('-')[0].toLowerCase(); const v = voces.find(v => v.lang.toLowerCase().startsWith(b)); if (v) return v; }
    return null;
  }
  return {
    // OJO: al hablar mandamos minúsculas, se pronuncia mejor. En pantalla siempre MAYÚSCULAS.
    hablar(texto, idioma='es'){
      if (!('speechSynthesis' in window)) return;
      try{
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(String(texto).toLowerCase());
        const v = elegir(idioma === 'en' ? ['en-US','en-GB','en-AU'] : ['es-AR','es-ES','es-MX','es-US']);
        if (v){ u.voice = v; u.lang = v.lang; } else { u.lang = idioma === 'en' ? 'en-US' : 'es-ES'; }
        u.rate = .85; u.pitch = 1.15;
        speechSynthesis.speak(u);
      }catch(e){}
    },
    precalentar(){ cargar(); this.hablar(' '); }
  };
})();

/* --- SONIDOS: Web Audio API, sin archivos externos --- */
const Sonido = (() => {
  let ctx = null;
  function ac(){
    if (!ctx){ const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; ctx = new AC(); }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function nota(f, ini, dur, tipo='sine', vol=.22){
    const c = ac(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = tipo; o.frequency.value = f;
    g.gain.setValueAtTime(0, c.currentTime+ini);
    g.gain.linearRampToValueAtTime(vol, c.currentTime+ini+.02);
    g.gain.exponentialRampToValueAtTime(.001, c.currentTime+ini+dur);
    o.connect(g); g.connect(c.destination);
    o.start(c.currentTime+ini); o.stop(c.currentTime+ini+dur+.02);
  }
  return {
    ok(){ nota(659,0,.14); nota(880,.12,.18); },
    error(){ nota(180,0,.22,'square',.15); },
    fanfarria(){ [523,659,784,1046].forEach((f,i)=>nota(f,i*.11,.28,'triangle',.2)); },
    desbloquear(){ ac(); }
  };
})();

/* --- CONFETI --- */
const Confeti = (() => {
  const cv = document.getElementById('confeti'), cx = cv.getContext('2d');
  let piezas = [], corriendo = false;
  const COL = ['#7DD3FC','#F9A8D4','#FDE68A','#86EFAC','#C4B5FD','#FCA5A5'];
  const medir = () => { cv.width = innerWidth; cv.height = innerHeight; };
  addEventListener('resize', medir); medir();
  function frame(){
    cx.clearRect(0,0,cv.width,cv.height);
    piezas.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.vy+=.16; p.rot+=p.vr;
      cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot);
      cx.fillStyle = p.col; cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); cx.restore(); });
    piezas = piezas.filter(p => p.y < cv.height+40);
    if (piezas.length) requestAnimationFrame(frame);
    else { corriendo = false; cx.clearRect(0,0,cv.width,cv.height); }
  }
  return function(n=90){
    for (let i=0;i<n;i++) piezas.push({
      x: cv.width/2 + (Math.random()-.5)*cv.width*.6, y: cv.height*.35 + Math.random()*40,
      vx:(Math.random()-.5)*9, vy:Math.random()*-11-3, s:8+Math.random()*10,
      rot:Math.random()*6, vr:(Math.random()-.5)*.3, col:COL[(Math.random()*COL.length)|0] });
    if (!corriendo){ corriendo = true; requestAnimationFrame(frame); }
  };
})();

/* --- DRAG & DROP: MOUSE + DEDO, MOTOR ÚNICO --- */
const Drag = (() => {
  let arr = null, fant = null, res = null, handler = null;
  const mover = t => { fant.style.left = (t.clientX - fant.offsetWidth/2)+'px';
                       fant.style.top  = (t.clientY - fant.offsetHeight/2)+'px'; };
  const zonaEn = t => { const e = document.elementFromPoint(t.clientX, t.clientY); return e ? e.closest('[data-zone]') : null; };
  function resaltar(z){
    if (res === z) return;
    if (res) res.classList.remove('ring-4','ring-verde','scale-105');
    res = z; if (z) z.classList.add('ring-4','ring-verde','scale-105');
  }
  return {
    alSoltar(fn){ handler = fn; },
    ficha(el){
      el.classList.add('no-sel','cursor-grab');
      el.setAttribute('draggable','true');
      el.addEventListener('dragstart', e => { arr = el; try{ e.dataTransfer.setData('text/plain', el.dataset.val||''); }catch(_){}; el.classList.add('opacity-40'); });
      el.addEventListener('dragend',  () => { el.classList.remove('opacity-40'); resaltar(null); });
      el.addEventListener('touchstart', e => {
        arr = el; fant = el.cloneNode(true);
        fant.classList.add('fixed','pointer-events-none','z-[9997]','opacity-90');
        fant.style.width = el.offsetWidth+'px'; fant.style.height = el.offsetHeight+'px';
        fant.style.transform = 'scale(1.12)';
        document.body.appendChild(fant); mover(e.touches[0]); el.classList.add('opacity-30');
      }, {passive:true});
      el.addEventListener('touchmove', e => {
        if (!fant) return; e.preventDefault(); mover(e.touches[0]); resaltar(zonaEn(e.touches[0]));
      }, {passive:false});
      el.addEventListener('touchend', e => {
        if (!fant) return; fant.remove(); fant = null; el.classList.remove('opacity-30');
        const z = zonaEn(e.changedTouches[0]); resaltar(null);
        if (handler && z && arr) handler(z, arr);
        arr = null;
      });
      el.addEventListener('touchcancel', () => { if (fant){ fant.remove(); fant = null; } el.classList.remove('opacity-30'); resaltar(null); arr = null; });
    },
    zona(el){
      el.setAttribute('data-zone','1');
      el.addEventListener('dragover',  e => { e.preventDefault(); resaltar(el); });
      el.addEventListener('dragleave', () => resaltar(null));
      el.addEventListener('drop', e => { e.preventDefault(); resaltar(null); if (handler && arr) handler(el, arr); arr = null; });
    }
  };
})();

/* --- PUNTAJE: UNA CLAVE DE localStorage POR ÁREA --- */
const Puntos = (() => {
  const cartel = document.getElementById('marcador');
  let area = null, sesion = 0;
  const leer  = a => parseInt(localStorage.getItem('bb_'+a)||'0',10)||0;
  const pintar = () => { cartel.textContent = '⭐ '+sesion;
    cartel.classList.remove('pop'); void cartel.offsetWidth; cartel.classList.add('pop'); };
  return {
    area(a){ area = a; sesion = 0; pintar(); },
    sumar(n=1){ if(!area) return; sesion += n;
      try{ localStorage.setItem('bb_'+area, String(leer(area)+n)); }catch(e){} pintar(); },
    leer, reset(){ sesion = 0; pintar(); }
  };
})();

/* --- UTILIDADES --- */
const mezclar = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(p=>p[1]);
const $ = s => document.querySelector(s);
const vista = $('#vista'), titulo = $('#titulo');

/* MARCO SVG DECORATIVO REUTILIZABLE (SOL + NUBE + PASTO + EMOJI) */
function escenaSVG(emoji, fondo='#E0F2FE'){

    <rect x="4" y="4" width="292" height="182" rx="26" fill="${fondo}" stroke="#fff" stroke-width="8"/>
    <circle cx="252" cy="44" r="21" fill="#FDE68A"/>
    <g stroke="#FDE68A" stroke-width="5" stroke-linecap="round">
      <line x1="252" y1="12" x2="252" y2="2"/><line x1="282" y1="44" x2="294" y2="44"/><line x1="277" y1="20" x2="285" y2="12"/></g>
    <g fill="#fff"><circle cx="52" cy="50" r="16"/><circle cx="72" cy="44" r="20"/><circle cx="92" cy="52" r="14"/>
      <rect x="48" y="50" width="46" height="15" rx="7"/></g>
    <path d="M4 152 Q75 128 150 146 T296 140 L296 182 Q296 186 292 186 H8 Q4 186 4 182 Z" fill="#86EFAC"/>
    <text x="150" y="128" font-size="78" text-anchor="middle" dominant-baseline="middle">${emoji}</text>
  </svg>`;
}

/* CARTEL DE ÉXITO + CONFETI */
function festejar(texto, alTerminar){
  Confeti(120); Sonido.fanfarria(); Voz.hablar('muy bien');
  const c = document.createElement('div');
  c.className = 'fixed inset-0 z-[9996] flex items-center justify-center pointer-events-none px-6';
  c.innerHTML = `<div class="pop bg-white/95 rounded-3xl px-8 py-6 shadow-2xl border-8 border-verde text-center">
      <div class="text-6xl">🌟</div>
      <div class="font-titulo font-extrabold text-2xl sm:text-3xl mt-2">${texto}</div>
      <div class="font-titulo font-bold text-tinta/60">¡MUY BIEN!</div></div>`;
  document.body.appendChild(c);
  setTimeout(() => { c.remove(); if (alTerminar) alTerminar(); }, 2000);
}

/* BARRA INFERIOR ESTÁNDAR: ESCUCHAR · SIGUIENTE/REINICIAR · MENÚ */
function barra(opts = {}){
  return `<div class="mt-6 flex flex-wrap items-center justify-center gap-3 no-sel">
    ${opts.escuchar ? `<button id="bEsc" class="btn3d bg-amarillo rounded-3xl px-5 py-4 font-titulo font-extrabold text-base sm:text-lg">🔊 ESCUCHAR</button>`:''}
    <button id="bSig" class="btn3d bg-verde rounded-3xl px-5 py-4 font-titulo font-extrabold text-base sm:text-lg">${opts.textoSig || 'SIGUIENTE ➡️'}</button>
    <button id="bMenu" class="btn3d bg-white border-2 border-tinta/10 rounded-3xl px-5 py-4 font-titulo font-bold text-base sm:text-lg">🏠 MENÚ</button>
  </div>`;
}
function conectarBarra({ escuchar, siguiente }){
  const e = $('#bEsc'); if (e && escuchar) e.addEventListener('click', escuchar);
  $('#bSig').addEventListener('click', siguiente || (()=>{}));
  $('#bMenu').addEventListener('click', irInicio);
}


/* ==================================================================
   DATOS DE LAS 8 ÁREAS  (EN EL PROYECTO FINAL: 1 ARCHIVO POR ÁREA)
   ================================================================== */
const AREAS = [
  { id:'lectoescritura', nombre:'LECTOESCRITURA', emoji:'📚', color:'bg-cielo',    archivo:'lectoescritura.html', desc:'SÍLABAS Y LETRAS' },
  { id:'logica',         nombre:'LÓGICA',         emoji:'🧩', color:'bg-rosa',     archivo:'logica.html',         desc:'MEMO Y PATRONES' },
  { id:'ingles',         nombre:'INGLÉS',         emoji:'🌎', color:'bg-amarillo', archivo:'ingles.html',         desc:'ESCUCHÁ Y ELEGÍ' },
  { id:'matematica',     nombre:'MATEMÁTICA',     emoji:'🔢', color:'bg-verde',    archivo:'matematica.html',     desc:'CONTAR Y SUMAR' },
  { id:'ciencias',       nombre:'CIENCIAS',       emoji:'🔬', color:'bg-lila',     archivo:'ciencias.html',       desc:'ANIMALES Y CUERPO' },
  { id:'colores',        nombre:'COLORES Y FORMAS', emoji:'🎨', color:'bg-naranja',archivo:'colores-formas.html', desc:'DESDE 4 AÑOS' },
  { id:'caligrafia',     nombre:'CALIGRAFÍA',     emoji:'✏️', color:'bg-cielo',    archivo:'caligrafia.html',     desc:'TRAZÁ CON EL DEDO' }
];

/* 1 · LECTOESCRITURA — SÍLABAS */
const D_SILABAS = { palabra:'MALETA', emoji:'🧳', silabas:['MA','LE','TA'], distractores:['PA','TO'] };

/* 2 · LÓGICA — MEMO */
const D_MEMO = ['🐶','🐱','🐸','🐷'];

/* 3 · INGLÉS — ESCUCHÁ Y ELEGÍ */
const D_INGLES = { palabra:'DOG', es:'PERRO', opciones:[{e:'🐶',ok:true},{e:'🐱',ok:false},{e:'🐰',ok:false}] };

/* 4 · MATEMÁTICA — CONTEO */
const D_CONTEO = { emoji:'🍎', cantidad:3, opciones:[2,3,5] };

/* 5 · CIENCIAS — A SU HOGAR */
const D_HABITAT = { animales:[{e:'🐒',h:'selva'},{e:'🐠',h:'mar'},{e:'🐄',h:'granja'}],
                    hogares:[{id:'selva',e:'🌴',n:'SELVA'},{id:'mar',e:'🌊',n:'MAR'},{id:'granja',e:'🚜',n:'GRANJA'}] };

/* 6 · COLORES Y FORMAS — TOCÁ EL COLOR */
const D_COLOR = { nombre:'ROJO', opciones:[{e:'🍎',ok:true},{e:'🍋',ok:false},{e:'🫐',ok:false},{e:'🥑',ok:false}] };

/* 7 · CALIGRAFÍA — TRAZO GUIADO */
const D_TRAZO = { letra:'A', guia:[[[40,175],[110,35]],[[110,35],[180,175]],[[68,120],[152,120]]] };


/* ==================================================================
   BLOQUE 8 · PANEL DE INICIO
   ================================================================== */
function irInicio(){
  Puntos.area(null);
  titulo.innerHTML = '🎒 BUSY BOOK DIGITAL';
  $('#marcador').textContent = '⭐ ' + AREAS.reduce((s,a) => s + Puntos.leer(a.id), 0);

  const tarjetas = AREAS.map(a => `
    <button data-area="${a.id}" class="btn3d ${a.color} rounded-3xl p-4 text-center relative overflow-hidden">
      <div class="text-5xl sm:text-6xl mb-1 flota">${a.emoji}</div>
      <div class="font-titulo font-extrabold text-sm sm:text-lg leading-tight">${a.nombre}</div>
      <div class="text-[10px] sm:text-xs font-bold text-tinta/60 mt-0.5">${a.desc}</div>
      <div class="mt-2 bg-white/70 rounded-2xl py-1 font-titulo font-extrabold text-sm">⭐ ${Puntos.leer(a.id)}</div>
    </button>`).join('');

  vista.innerHTML = `
    <div class="text-center no-sel">
      <div class="bg-gradient-to-r from-cielo/40 via-amarillo/40 to-rosa/40 rounded-3xl px-4 py-4 mb-5">
        <h2 class="font-titulo font-extrabold text-2xl sm:text-4xl">¡HOLA! 👋</h2>
        <p class="font-titulo font-bold text-sm sm:text-xl text-tinta/70 mt-1">TOCÁ UN DIBUJO PARA JUGAR</p>
      </div>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">${tarjetas}</div>
      <div class="mt-6 bg-amarillo/50 rounded-3xl px-6 py-4 inline-block">
        <div class="font-titulo font-bold text-tinta/70 text-sm">TOTAL DE ESTRELLAS</div>
        <div class="font-titulo font-extrabold text-4xl">⭐ ${AREAS.reduce((s,a)=>s+Puntos.leer(a.id),0)}</div>
      </div>
    </div>`;

  vista.querySelectorAll('[data-area]').forEach(b =>
    b.addEventListener('click', () => abrir(b.dataset.area)));
}

/* ROUTER DEL MOCK. EN EL PROYECTO FINAL CADA TARJETA SERÁ UN <a href="archivo.html"> */
function abrir(id){
  const a = AREAS.find(x => x.id === id);
  Puntos.area(id);
  titulo.innerHTML = a.emoji + ' ' + a.nombre;
  ({ lectoescritura:bLectoescritura, logica:bLogica, ingles:bIngles, matematica:bMatematica,
     ciencias:bCiencias, colores:bColores, caligrafia:bCaligrafia })[id]();
}

/* ENCABEZADO DE CONSIGNA REUTILIZABLE */
const consigna = (t, sub='') => `
  <h2 class="font-titulo font-extrabold text-lg sm:text-2xl text-center leading-tight">${t}</h2>
  ${sub ? `<p class="text-center font-bold text-tinta/60 text-sm sm:text-base mt-1">${sub}</p>` : ''}`;


/* ==================================================================
   BLOQUE 1 · LECTOESCRITURA — ARMAR "MALETA" CON SÍLABAS
   ================================================================== */
function bLectoescritura(){
  const d = D_SILABAS;
  const slots = d.silabas.map((_,i) => `
    <div class="zs w-20 h-20 sm:w-24 sm:h-24 rounded-3xl bg-cielo/25 border-4 border-dashed border-cielo
      flex items-center justify-center font-titulo font-extrabold text-2xl sm:text-3xl transition-transform" data-idx="${i}"></div>`).join('');
  const banco = mezclar([...d.silabas, ...d.distractores]).map(s => `
    <div class="fs btn3d bg-amarillo rounded-3xl px-4 py-3 min-w-[4.5rem] text-center
      font-titulo font-extrabold text-2xl sm:text-3xl" data-val="${s}">${s}</div>`).join('');

  vista.innerHTML = `<div>
    ${consigna('ARMÁ LA PALABRA','ARRASTRÁ LAS SÍLABAS A SU LUGAR')}
    <div class="my-3">${escenaSVG(d.emoji)}</div>
    <div class="flex flex-wrap justify-center gap-2 sm:gap-3 my-4">${slots}</div>
    <div class="bg-crema rounded-3xl p-3 border-4 border-amarillo/60">
      <p class="font-titulo font-bold text-tinta/60 text-center text-sm mb-2">BANCO DE SÍLABAS</p>
      <div class="flex flex-wrap justify-center gap-2 sm:gap-3">${banco}</div>
    </div>
    ${barra({ escuchar:true, textoSig:'🔄 REINICIAR' })}
  </div>`;

  let ok = 0;
  vista.querySelectorAll('.zs').forEach(z => Drag.zona(z));
  vista.querySelectorAll('.fs').forEach(f => { Drag.ficha(f);
    f.addEventListener('click', () => Voz.hablar(f.dataset.val)); });

  Drag.alSoltar((z, f) => {
    if (!z.matches('.zs') || z.dataset.listo) return;
    if (f.dataset.val === d.silabas[+z.dataset.idx]){
      z.textContent = f.dataset.val; z.dataset.listo = 1;

      f.classList.add('invisible','pointer-events-none');
      Sonido.ok(); Voz.hablar(f.dataset.val); Puntos.sumar(1);
      if (++ok === d.silabas.length) festejar(d.palabra, bLectoescritura);
    } else { Sonido.error(); z.classList.add('shake'); setTimeout(()=>z.classList.remove('shake'),450); }
  });

/* ==================================================================
   BLOQUE 2 · LÓGICA — MEMO DE PARES
   ================================================================== */
function bLogica(){
  const cartas = mezclar([...D_MEMO, ...D_MEMO]);
  vista.innerHTML = `<div>
    ${consigna('JUEGO DE MEMORIA','ENCONTRÁ LAS PAREJAS IGUALES')}
    <div class="grid grid-cols-4 gap-2 sm:gap-3 max-w-md mx-auto my-5">
      ${cartas.map((e,i)=>`
        <button class="carta aspect-square rounded-3xl bg-rosa btn3d flex items-center justify-center
          text-3xl sm:text-5xl" data-e="${e}" data-i="${i}"><span class="cara">❓</span></button>`).join('')}
    </div>
    ${barra({ textoSig:'🔄 REINICIAR' })}
  </div>`;

  let abiertas = [], bloqueado = false, pares = 0;
  vista.querySelectorAll('.carta').forEach(c => c.addEventListener('click', () => {
    if (bloqueado || c.dataset.ok || abiertas.includes(c)) return;
    c.querySelector('.cara').textContent = c.dataset.e;
    c.classList.add('pop'); abiertas.push(c);

    if (abiertas.length === 2){
      const [a,b] = abiertas;
      if (a.dataset.e === b.dataset.e){
        a.dataset.ok = b.dataset.ok = 1;
        [a,b].forEach(x => { x.classList.remove('bg-rosa'); x.classList.add('bg-verde'); });
        Sonido.ok(); Puntos.sumar(1); abiertas = [];
        if (++pares === D_MEMO.length) festejar('¡TODAS LAS PAREJAS!', bLogica);
      } else {
        bloqueado = true; Sonido.error();
        [a,b].forEach(x => x.classList.add('shake'));
        setTimeout(() => { [a,b].forEach(x => { x.classList.remove('shake');
          x.querySelector('.cara').textContent = '❓'; }); abiertas = []; bloqueado = false; }, 800);
      }
    }
  }));
  conectarBarra({ siguiente:bLogica });
}

/* ==================================================================
   BLOQUE 7 · CALIGRAFÍA — TRAZO LIBRE SOBRE GUÍA PUNTEADA (CANVAS)
   ================================================================== */
function bCaligrafia(){
  const d = D_TRAZO;
  vista.innerHTML = `<div>
    ${consigna('TRAZÁ LA LETRA ' + d.letra,'SEGUÍ LOS PUNTITOS CON EL DEDO')}
    <div class="flex justify-center my-4">
      <canvas id="trazo" width="220" height="220"
        class="bg-crema rounded-3xl border-4 border-cielo shadow-inner"></canvas>
    </div>
    <div class="flex flex-wrap justify-center gap-3 no-sel">
      <button id="bBorrar" class="btn3d bg-rosa rounded-3xl px-5 py-4 font-titulo font-extrabold text-base sm:text-lg">🧽 BORRAR</button>
      <button id="bEsc" class="btn3d bg-amarillo rounded-3xl px-5 py-4 font-titulo font-extrabold text-base sm:text-lg">🔊 ESCUCHAR</button>
      <button id="bSig" class="btn3d bg-verde rounded-3xl px-5 py-4 font-titulo font-extrabold text-base sm:text-lg">SIGUIENTE ➡️</button>
      <button id="bMenu" class="btn3d bg-white border-2 border-tinta/10 rounded-3xl px-5 py-4 font-titulo font-bold text-base sm:text-lg">🏠 MENÚ</button>
    </div>
  </div>`;

  const cv = $('#trazo'), cx = cv.getContext('2d');
  let pintando = false, recorrido = 0, ultimo = null, hecho = false;

  // GUÍA PUNTEADA + NUMERITOS DE ORDEN DE TRAZO
  function guia(){
    cx.clearRect(0,0,cv.width,cv.height);
    cx.setLineDash([7,9]); cx.lineWidth = 12; cx.strokeStyle = '#CBD5E1'; cx.lineCap = 'round';
    d.guia.forEach(([a,b]) => { cx.beginPath(); cx.moveTo(a[0],a[1]); cx.lineTo(b[0],b[1]); cx.stroke(); });
    cx.setLineDash([]);
    // INDICACIÓN SUTIL DE ORDEN Y DIRECCIÓN
    d.guia.forEach(([a], i) => {
      cx.fillStyle = '#7DD3FC'; cx.beginPath(); cx.arc(a[0],a[1],11,0,7); cx.fill();
      cx.fillStyle = '#fff'; cx.font = 'bold 14px Nunito, sans-serif';
      cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText(i+1, a[0], a[1]+1);
    });
  }
  guia();

  const punto = e => {
    const r = cv.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x:(t.clientX - r.left) * cv.width / r.width, y:(t.clientY - r.top) * cv.height / r.height };
  };
  function arrancar(e){ e.preventDefault(); pintando = true; ultimo = punto(e); }
  function mover(e){
    if (!pintando) return; e.preventDefault();
    const p = punto(e);
    cx.strokeStyle = '#F472B6'; cx.lineWidth = 11; cx.lineCap = 'round'; cx.lineJoin = 'round';
    cx.beginPath(); cx.moveTo(ultimo.x, ultimo.y); cx.lineTo(p.x, p.y); cx.stroke();
    recorrido += Math.hypot(p.x - ultimo.x, p.y - ultimo.y);
    ultimo = p;
    // TRAZO SUFICIENTE → ÉXITO (NUNCA BLOQUEAMOS EL TRAZO LIBRE)
    if (!hecho && recorrido > 330){
      hecho = true; Puntos.sumar(2);
      setTimeout(() => Voz.hablar('la letra ' + d.letra), 300);
      festejar('LETRA ' + d.letra, bCaligrafia);
    }
  }
  const soltar = () => { pintando = false; };

  cv.addEventListener('mousedown', arrancar); cv.addEventListener('mousemove', mover);
  addEventListener('mouseup', soltar);
  cv.addEventListener('touchstart', arrancar, {passive:false});
  cv.addEventListener('touchmove', mover, {passive:false});
  cv.addEventListener('touchend', soltar);

  $('#bBorrar').addEventListener('click', () => { recorrido = 0; hecho = false; guia(); });
  $('#bEsc').addEventListener('click', () => Voz.hablar('la letra ' + d.letra));
  $('#bSig').addEventListener('click', bCaligrafia);
  $('#bMenu').addEventListener('click', irInicio);
  Voz.hablar('trazá la letra ' + d.letra);
}
