<style>
/* ==================================================================
   BUSY BOOK DIGITAL · ESTILO COMPARTIDO
   Lo usan los 8 archivos. Se carga con:
   <link rel="stylesheet" href="estilo.css">
   ================================================================== */

/* REGLA DEL PROYECTO: todo el texto visible va en MAYÚSCULAS.
   Los strings ya están en mayúsculas en los datos; esto es la red
   de seguridad para que nunca se escape una minúscula. */
body{
  text-transform: uppercase;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

/* Los <select> y los <input> no heredan bien el text-transform */
select, input, button, textarea{ text-transform: uppercase; }

.no-sel{
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}

/* Botón con sombra sólida que se hunde al presionar.
   Pensado para dedos: no depende de :hover. */
.btn3d{
  box-shadow: 0 6px 0 rgba(0,0,0,.18);
  transition: transform .08s, box-shadow .08s;
}
.btn3d:active{
  transform: translateY(4px);
  box-shadow: 0 2px 0 rgba(0,0,0,.18);
}

/* Error: sacude pero no bloquea. Nunca frustramos al chico. */
.shake{ animation: shake .4s ease; }
@keyframes shake{
  0%,100%{ transform: translateX(0) }
  20%{ transform: translateX(-9px) }
  50%{ transform: translateX(9px) }
  80%{ transform: translateX(-5px) }
}

/* Acierto: aparece con rebote */
.pop{ animation: pop .45s cubic-bezier(.2,1.6,.4,1); }
@keyframes pop{
  0%{ transform: scale(.3) }
  65%{ transform: scale(1.18) }
  100%{ transform: scale(1) }
}

.flota{ animation: flota 2.6s ease-in-out infinite; }
@keyframes flota{
  0%,100%{ transform: translateY(0) }
  50%{ transform: translateY(-7px) }
}

.brilla{ animation: brilla 1.3s ease-in-out infinite; }
@keyframes brilla{
  0%,100%{ filter: brightness(1) }
  50%{ filter: brightness(1.25) }
}

/* El canvas de caligrafía no debe hacer scroll al trazar */
canvas.trazo{ touch-action: none; }

/* Bancos de fichas que scrollean de costado en celular */
.scroll-x{ -webkit-overflow-scrolling: touch; overflow-x: auto; }

/* Respeta a quien tenga las animaciones desactivadas en el sistema */
@media (prefers-reduced-motion: reduce){
  .flota, .brilla{ animation: none; }
}

/* Burbujas de "Reventá las Burbujas": suben desde abajo, en loop CSS puro
   (sin setInterval de JS), para no repetir el bug de listeners viejo. */
.burbuja-sube{ animation-name: subirburbuja; animation-timing-function: linear; animation-iteration-count: infinite; }
@keyframes subirburbuja{
  0%{ transform: translateY(0); opacity: 1; }
  100%{ transform: translateY(-58vh); opacity: 1; }
}
@media (prefers-reduced-motion: reduce){
  .burbuja-sube{ animation: none; bottom: 40% !important; }
}

</style>

/* ==================================================================
   3 · PARSEO
   Convierte el texto compacto de arriba en objetos usables.
   ================================================================== */

/** Quita acentos: LEÓN → LEON. Se usa para comparar y para el teclado.
    ⚠️ La Ñ NO es una N con acento: es otra letra. Hay que protegerla antes
    de normalizar, si no MOÑO se convierte en MONO (bug real que tuvimos). */
function sinAcento(t){
  return String(t)
    .replace(/Ñ/g, '').replace(/ñ/g, '')   // guardamos las eñes
    .normalize('NFD').replace(/[̀-ͯ]/g, '')  // saca tildes y diéresis
    .replace(//g, 'Ñ').replace(//g, 'ñ');  // las devolvemos
}

const PALABRAS = [];
const PORTEXTO = Object.create(null);   // índice para buscar rápido

for (const [cat, crudo] of Object.entries(CRUDO)){
  for (const token of crudo.trim().split(/\s+/)){
    if (!token) continue;
    const i = token.lastIndexOf(':');
    // El guion bajo es un espacio: DULCE_DE_LECHE → "DULCE DE LECHE".
    // Hace falta porque separamos los tokens por espacios.
    const texto  = (i > 0 ? token.slice(0, i) : token).toUpperCase().replace(/_/g, ' ');
    const codigo =  i > 0 ? token.slice(i + 1) : null;

    const esNombre = (cat === 'nombres');
    const p = {
      texto,                            // MAYÚSCULAS con acento: LEÓN
      plano: sinAcento(texto),          // LEON — para comparar y escribir
      cat,
      largo: sinAcento(texto).length,
      // En nombres el "código" es el género, no un dibujo
      genero: esNombre ? (codigo || 'x') : null,
      twemoji: esNombre ? null : codigo,
      cats: null,      // se llena abajo
      esColor: false   // se calcula abajo
    };
    PALABRAS.push(p);

    /* Varias palabras están en dos categorías: LEÓN es nombre propio Y animal,
       SOL es nombre Y clima, ROSA es color Y flor, NARANJA es color Y fruta.
       - `cats` es un array COMPARTIDO por todas las versiones de la palabra,
         así cualquiera de ellas sabe en qué categorías aparece.
       - Como representante para buscar() elegimos la versión que tenga dibujo,
         para que LEÓN muestre 🦁 y no 👦.                                    */
    const previa = PORTEXTO[p.plano];
    if (!previa){
      p.cats = [cat];
      PORTEXTO[p.plano] = p;
    } else {
      p.cats = previa.cats;                             // misma referencia
      if (!p.cats.includes(cat)) p.cats.push(cat);
      if (!previa.twemoji && p.twemoji) PORTEXTO[p.plano] = p;
    }
  }
}

/* Círculo de color en vez de dibujo, pero SOLO si la palabra no tiene un
   dibujo propio. Así AZUL sale como círculo azul, y ROSA sale como 🌹
   (el juego de colores puede pedir el círculo igual, ver Img.html). */
for (const p of PALABRAS){
  p.esColor = p.cats.includes('colores') && !p.twemoji;
}

/* ==================================================================
   4 · API PÚBLICA
   ================================================================== */
return {
  CATEGORIAS,
  PALABRAS,
  sinAcento,

  /** ¿Existe esta palabra? Ignora acentos y mayúsculas. → objeto o null */
  buscar(texto){
    return PORTEXTO[sinAcento(String(texto).toUpperCase())] || null;
  },

  /** Filtra el banco. Ej: filtrar({cat:'animales', conDibujo:true, maxLargo:6}) */
  filtrar({ cat = null, conDibujo = null, minLargo = 0, maxLargo = 99 } = {}){
    return PALABRAS.filter(p =>
      (cat === null || p.cat === cat) &&
      (conDibujo === null || (!!p.twemoji) === conDibujo) &&
      p.largo >= minLargo && p.largo <= maxLargo
    );
  },

  /** Los 99 nombres, para el selector de perfil */
  nombres(){ return PALABRAS.filter(p => p.cat === 'nombres'); },

  /** Números útiles, para chequear que el banco esté completo */
  resumen(){
    const r = { total: PALABRAS.length, conDibujo: 0, porCategoria: {} };
    for (const p of PALABRAS){
      if (p.twemoji) r.conDibujo++;
      r.porCategoria[p.cat] = (r.porCategoria[p.cat] || 0) + 1;
    }
    r.sinDibujo = r.total - r.conDibujo;
    return r;
  }
};
})();

window.MOTOR = (() => {

/* ==================================================================
   0 · ALMACENAMIENTO SEGURO
   En algunos celus/navegadores (modo privado, WebViews de apps como
   WhatsApp o un explorador de archivos, ajustes de privacidad estrictos,
   o abrir el juego desde un archivo local sin conexión) el simple hecho
   de TOCAR localStorage.getItem/setItem puede tirar una excepción
   (SecurityError), no solo devolver null. Si eso pasa sin un try/catch,
   el script entero se frena ahí mismo y la página queda en blanco, sin
   ningún error visible para el chico ni para nosotros.
   Por eso todo el motor pasa por ALM en vez de tocar localStorage directo:
   si funciona, usa el almacenamiento real (se guarda entre visitas); si
   no, sigue jugando igual con un almacenamiento en memoria (se resetea
   al cerrar, pero el juego NUNCA se rompe por esto). ================== */
const ALM = (() => {
  const memoria = {};
  let sirve = true;
  try { localStorage.setItem('bb_test', '1'); localStorage.removeItem('bb_test'); }
  catch(e){ sirve = false; }
  return {
    get(clave){
      if (!sirve) return memoria[clave] ?? null;
      try { return localStorage.getItem(clave); } catch(e){ return memoria[clave] ?? null; }
    },
    set(clave, valor){
      memoria[clave] = valor;
      if (!sirve) return;
      try { localStorage.setItem(clave, valor); } catch(e){}
    },
    quitar(clave){
      delete memoria[clave];
      if (!sirve) return;
      try { localStorage.removeItem(clave); } catch(e){}
    }
  };
})();

/* ==================================================================
   1 · VOZ
   El navegador no trae voz propia: usa la del sistema operativo.
   Por eso suena distinto en Windows, Android y iPhone.
   Solución: dejamos que se elija la voz y la recordamos.
   ================================================================== */
const Voz = (() => {
  const CLAVE_ES = 'bb_voz_es', CLAVE_EN = 'bb_voz_en', CLAVE_ON = 'bb_voz_activa';
  let voces = [];

  function cargar(){
    try { voces = (speechSynthesis.getVoices() || []); } catch(e){ voces = []; }
  }
  if ('speechSynthesis' in window){
    cargar();
    speechSynthesis.addEventListener('voiceschanged', cargar);
  }

  /** Voces disponibles para un idioma, ordenadas por preferencia argentina */
  function disponibles(idioma = 'es'){
    const base = idioma === 'en' ? 'en' : 'es';
    const orden = idioma === 'en'
      ? ['en-us','en-gb','en-au']
      : ['es-ar','es-419','es-mx','es-us','es-es'];
    return voces
      .filter(v => v.lang.replace('_','-').toLowerCase().startsWith(base))
      .sort((a,b) => {
        const ia = orden.indexOf(a.lang.replace('_','-').toLowerCase());
        const ib = orden.indexOf(b.lang.replace('_','-').toLowerCase());
        return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
      });
  }

  /** La voz elegida a mano, o la mejor disponible, o null */
  function elegida(idioma = 'es'){
    const guardada = ALM.get(idioma === 'en' ? CLAVE_EN : CLAVE_ES);
    const lista = disponibles(idioma);
    if (guardada){
      const v = lista.find(v => v.name === guardada);
      if (v) return v;
    }
    return lista[0] || null;
  }

  return {
    disponibles, elegida,
    guardar(idioma, nombre){
      ALM.set(idioma === 'en' ? CLAVE_EN : CLAVE_ES, nombre);
    },
    activa(){ return ALM.get(CLAVE_ON) !== 'no'; },
    activar(si){ ALM.set(CLAVE_ON, si ? 'si' : 'no'); },

    /** hablar('PERRO') · hablar('DOG','en')
        Le pasamos el texto en minúscula porque se pronuncia mucho mejor:
        en mayúsculas algunos motores leen letra por letra. */
    hablar(texto, idioma = 'es'){
      if (!('speechSynthesis' in window) || !this.activa()) return;
      try {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(String(texto).toLowerCase());
        const v = elegida(idioma);
        if (v){ u.voice = v; u.lang = v.lang; }
        else  { u.lang = idioma === 'en' ? 'en-US' : 'es-ES'; }
        u.rate = 0.85; u.pitch = 1.12;
        speechSynthesis.speak(u);
      } catch(e){ /* nunca frenamos el juego por el audio */ }
    },

    /** Los móviles no cargan las voces hasta que hay una interacción */
    precalentar(){
      cargar();
      if (!('speechSynthesis' in window)) return;
      try {
        const u = new SpeechSynthesisUtterance(' ');
        u.volume = 0; speechSynthesis.speak(u);
      } catch(e){}
    },

    /** Corta cualquier frase que esté sonando. Hay que llamarla al salir de
        un juego (menú, inicio, elegir otro bloque): sin esto, la última
        frase del juego anterior sigue sonando arriba de la pantalla nueva,
        porque el speechSynthesis no se corta solo al cambiar de pantalla. */
    detener(){
      if (!('speechSynthesis' in window)) return;
      try { speechSynthesis.cancel(); } catch(e){}
    }
  };
})();


/* ==================================================================
   2 · SONIDO
   ⚠️ Todos los tonos van entre 400 y 1200 Hz: los parlantes de
   celular no reproducen graves. Un tono de 180 Hz que en la compu
   suena bien, en el celu no se escucha.
   ================================================================== */
const Sonido = (() => {
  const CLAVE = 'bb_sonido_activo';
  let ctx = null;

  function ac(){
    if (!ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function nota(freq, ini, dur, tipo = 'sine', vol = 0.25){
    if (ALM.get(CLAVE) === 'no') return;
    const c = ac(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = tipo; o.frequency.value = freq;
    g.gain.setValueAtTime(0, c.currentTime + ini);
    g.gain.linearRampToValueAtTime(vol, c.currentTime + ini + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0008, c.currentTime + ini + dur);
    o.connect(g); g.connect(c.destination);
    o.start(c.currentTime + ini); o.stop(c.currentTime + ini + dur + 0.03);
  }
  return {
    ok(){        nota(659, 0, 0.13, 'sine');  nota(988, 0.11, 0.20, 'sine'); },
    error(){     nota(466, 0, 0.14, 'square', .18); nota(415, 0.12, 0.18, 'square', .18); },
    fanfarria(){ [523, 659, 784, 1046].forEach((f,i) => nota(f, i*0.10, 0.30, 'triangle', .22)); },
    toque(){     nota(880, 0, 0.06, 'sine', .13); },
    /* Expuesta para el Xilófono/Piano: una nota musical real, no un
       efecto de acierto/error. */
    nota(freq, ini = 0, dur = 0.35, tipo = 'triangle', vol = 0.28){ nota(freq, ini, dur, tipo, vol); },
    activo(){ return ALM.get(CLAVE) !== 'no'; },
    activar(si){ ALM.set(CLAVE, si ? 'si' : 'no'); },
    desbloquear(){ ac(); }
  };
})();


/* ==================================================================
   3 · CONFETI
   ================================================================== */
const Confeti = (() => {
  let cv = null, cx = null, piezas = [], corriendo = false;
  const COL = ['#7DD3FC','#F9A8D4','#FDE68A','#86EFAC','#C4B5FD','#FCA5A5'];

  function preparar(){
    if (cv) return;
    cv = document.createElement('canvas');
    cv.id = 'bb-confeti';
    cv.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:9998';
    document.body.appendChild(cv);
    cx = cv.getContext('2d');
    const medir = () => { cv.width = innerWidth; cv.height = innerHeight; };
    addEventListener('resize', medir); medir();
  }
  function frame(){
    cx.clearRect(0, 0, cv.width, cv.height);
    piezas.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.16; p.rot += p.vr;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot);
      cx.fillStyle = p.col; cx.fillRect(-p.s/2, -p.s/2, p.s, p.s*0.6); cx.restore();
    });
    piezas = piezas.filter(p => p.y < cv.height + 40);
    if (piezas.length) requestAnimationFrame(frame);
    else { corriendo = false; cx.clearRect(0, 0, cv.width, cv.height); }
  }
  return function lanzar(n = 110){
    preparar();
    for (let i = 0; i < n; i++) piezas.push({
      x: cv.width/2 + (Math.random()-0.5)*cv.width*0.6,
      y: cv.height*0.35 + Math.random()*40,
      vx: (Math.random()-0.5)*9, vy: Math.random()*-11 - 3,
      s: 8 + Math.random()*10, rot: Math.random()*6, vr: (Math.random()-0.5)*0.3,
      col: COL[(Math.random()*COL.length)|0]
    });
    if (!corriendo){ corriendo = true; requestAnimationFrame(frame); }
  };
})();


/* ==================================================================
   4 · DRAG & DROP (mouse + dedo)
   Fichas: cualquier elemento pasado a Drag.ficha(el)
   Zonas : cualquier elemento pasado a Drag.zona(el)
   Al soltar se llama al handler de Drag.alSoltar(fn)
   ================================================================== */
const Drag = (() => {
  let arr = null, fant = null, res = null, handler = null;

  const mover = t => {
    fant.style.left = (t.clientX - fant.offsetWidth/2) + 'px';
    fant.style.top  = (t.clientY - fant.offsetHeight/2) + 'px';
  };
  const zonaEn = t => {
    const e = document.elementFromPoint(t.clientX, t.clientY);
    return e ? e.closest('[data-zone]') : null;
  };
  function resaltar(z){
    if (res === z) return;
    if (res) res.classList.remove('ring-4','ring-verde','scale-105');
    res = z;
    if (z) z.classList.add('ring-4','ring-verde','scale-105');
  }
  return {
    alSoltar(fn){ handler = fn; },
    ficha(el){
      el.classList.add('no-sel');
      el.style.cursor = 'grab';
      el.setAttribute('draggable','true');

      el.addEventListener('dragstart', e => {
        arr = el;
        try { e.dataTransfer.setData('text/plain', el.dataset.val || ''); } catch(_){}
        el.classList.add('opacity-40');
      });
      el.addEventListener('dragend', () => { el.classList.remove('opacity-40'); resaltar(null); });

      el.addEventListener('touchstart', e => {
        arr = el;
        fant = el.cloneNode(true);
        fant.classList.add('fixed','pointer-events-none','opacity-90');
        fant.style.zIndex = '9997';
        fant.style.width  = el.offsetWidth  + 'px';
        fant.style.height = el.offsetHeight + 'px';
        fant.style.transform = 'scale(1.12)';
        document.body.appendChild(fant);
        mover(e.touches[0]);
        el.classList.add('opacity-30');
      }, { passive:true });

      el.addEventListener('touchmove', e => {
        if (!fant) return;
        e.preventDefault();                 // que la página no scrollee al arrastrar
        mover(e.touches[0]);
        resaltar(zonaEn(e.touches[0]));
      }, { passive:false });

      el.addEventListener('touchend', e => {
        if (!fant) return;
        fant.remove(); fant = null;
        el.classList.remove('opacity-30');
        const z = zonaEn(e.changedTouches[0]);
        resaltar(null);
        if (handler && z && arr) handler(z, arr);
        arr = null;
      });

      el.addEventListener('touchcancel', () => {
        if (fant){ fant.remove(); fant = null; }
        el.classList.remove('opacity-30'); resaltar(null); arr = null;
      });
    },
    zona(el){
      el.setAttribute('data-zone','1');
      el.addEventListener('dragover',  e => { e.preventDefault(); resaltar(el); });
      el.addEventListener('dragleave', () => resaltar(null));
      el.addEventListener('drop', e => {
        e.preventDefault(); resaltar(null);
        if (handler && arr) handler(el, arr);
        arr = null;
      });
    }
  };
})();


/* ==================================================================
   5 · SILABEADOR AUTOMÁTICO DE ESPAÑOL
   ------------------------------------------------------------------
   Nadie corta 871 palabras a mano. Reglas que aplica:
     · Dígrafos que no se separan nunca:  CH  LL  RR  QU(e/i)  GU(e/i)
     · Grupos trabados que van juntos:    BR BL CR CL DR FR FL GR GL PR PL TR TL
       → LI-BRO (no LIB-RO) · TA-BLA · BI-CI-CLE-TA
     · Diptongos y hiatos:
       fuerte+fuerte se separa       → LE-ER, TO-A-LLA
       vocal débil con tilde separa  → RÍ-O, DÍ-A, MA-ÍZ, AR-CO-Í-RIS
       el resto van juntas           → PIE, A-GUA, ES-TE-GO-SAU-RIO
   ================================================================== */
const Silabas = (() => {
  const VOC       = 'AEIOUÁÉÍÓÚÜ';
  const FUERTES   = 'AEOÁÉÓ';
  const DEBIL_TIL = 'ÍÚ';                        // débil acentuada: rompe el diptongo
  const DIGRAFOS  = ['CH','LL','RR'];
  const TRABADAS  = ['BR','BL','CR','CL','DR','FR','FL','GR','GL','PR','PL','TR','TL'];

  const esVoc = c => VOC.includes(c);

  /** Parte la palabra en unidades: CH y LL cuentan como una sola letra */
  function unidades(p){
    const U = [];
    for (let i = 0; i < p.length; i++){
      const par = p.substr(i, 2), sig = p[i+2] || '';
      if (DIGRAFOS.includes(par)){ U.push({ t:'c', v:par }); i++; continue; }
      // QU y GU sólo son dígrafo delante de E o I (QUESO, JUGUETE).
      // En GUARDAPOLVO o AGUA la U suena, así que no lo son.
      if ((par === 'QU' || par === 'GU') && 'EIÉÍ'.includes(sig)){ U.push({ t:'c', v:par }); i++; continue; }
      U.push({ t: esVoc(p[i]) ? 'v' : 'c', v: p[i] });
    }
    return U;
  }

  /** ¿Estas dos vocales suenan en la misma sílaba? */
  function mismoNucleo(a, b){
    if (DEBIL_TIL.includes(a) || DEBIL_TIL.includes(b)) return false;   // RÍ-O
    if (FUERTES.includes(a)   && FUERTES.includes(b))   return false;   // LE-ER
    return true;                                                        // PIE, GUA, SAU
  }

  const esTrabada = cons =>
    cons.length === 2 &&
    cons[0].v.length === 1 && cons[1].v.length === 1 &&
    TRABADAS.includes(cons[0].v + cons[1].v);

  function separar(palabra){
    const p = String(palabra).toUpperCase().replace(/[^A-ZÁÉÍÓÚÜÑ]/g, '');
    if (p.length < 2) return p ? [p] : [];
    const U = unidades(p);

    /* 1 · Agrupar las vocales en núcleos */
    const nucleos = [];
    for (let i = 0; i < U.length; i++){
      if (U[i].t !== 'v') continue;
      let j = i;
      while (j + 1 < U.length && U[j+1].t === 'v' && mismoNucleo(U[j].v, U[j+1].v)) j++;
      nucleos.push([i, j]);
      i = j;
    }
    if (!nucleos.length) return [p];                 // palabra sin vocales

    /* 2 · Decidir dónde corta cada sílaba */
    const cortes = [0];
    for (let n = 0; n < nucleos.length - 1; n++){
      const fin = nucleos[n][1], ini = nucleos[n+1][0];
      const cons = U.slice(fin + 1, ini);
      let corte;
      switch (cons.length){
        case 0:  corte = ini;                                        break;  // hiato: LE|ER
        case 1:  corte = ini - 1;                                    break;  // CA|SA
        case 2:  corte = esTrabada(cons)        ? ini - 2 : ini - 1;  break;  // LI|BRO · AR|TE
        case 3:  corte = esTrabada(cons.slice(1)) ? ini - 2 : ini - 1; break;  // EN|TRAR · INS|TAR
        default: corte = ini - 2;                                    break;  // CONS|TRUIR
      }
      cortes.push(corte);
    }

    /* 3 · Cortar */
    const salida = [];
    for (let c = 0; c < cortes.length; c++){
      const a = cortes[c];
      const b = (c + 1 < cortes.length) ? cortes[c+1] : U.length;
      salida.push(U.slice(a, b).map(u => u.v).join(''));
    }
    return salida.filter(Boolean);
  }

  return { separar, unidades };
})();


/* ==================================================================
   6 · IMÁGENES
   Prioridad:  img/propias/<palabra>.png  →  img/twemoji/<codigo>.svg
               →  dibujo de reserva de la categoría
   Así, apenas Tamara guarda una imagen propia, gana sin tocar código.
   ================================================================== */
/* Slugs de las imágenes que ya están en img/propias/ (sin la extensión).
   Se usa para que estas palabras cuenten como "con dibujo" en Img.tiene(),
   aunque no tengan un twemoji específico (por eso Tamara las dibujó: MATE,
   DULCE DE LECHE, etc. no existen en Twemoji). Cuando agregue imágenes
   nuevas, hay que sumar el slug acá para que aparezcan en TODOS los juegos
   y no solo en los que muestran la imagen sin filtrar (como el puzzle). */
const IMAGENES_PROPIAS = new Set([
  'bombilla','brontosaurio','calesita','cartuchera','chipa','colectivo','diplodocus',
  'donas','dulce-de-leche','empanada','estegosaurio','facturas','fideos','guardapolvo',
  'hamaca','hamburguesa','jugo','leche','manteca','mate','medialuna','mermelada',
  'milanesa','pelotero','pizarron','pizza','plasticola','plastilina','queso','subibaja',
  'subte','t-rex','taxi','termo','tijera','triceratops','vaso','velociraptor','yerba',
  'abuela','abuelo','adolescente','adolescente1','mama','mujer','nena','nino','papa','senor'
]);

/* Alias: palabras que NO tienen su propia imagen pero comparten el dibujo
   de otra (por ejemplo HERMANO usa el mismo dibujo que ADOLESCENTE, porque
   Tamara dibujó "un chico" genérico para varias cosas en vez de una imagen
   por palabra). Las claves son el SLUG de la palabra (sin tildes), el valor
   es el slug del archivo real dentro de img/propias/.
   OJO: esto es el dibujo por DEFECTO para los juegos de vocabulario general
   (memo, escuchá y elegí, etc.). El futuro juego de la familia va a poder
   elegir un dibujo distinto según el contexto (ej: "el hermano de tu papá"
   usa la versión adulta) — esa lógica va a vivir en ese juego, no acá. */
const ALIAS_IMG = {
  hermano:'adolescente', primo:'adolescente',
  hermana:'adolescente1', prima:'adolescente1', amiga:'adolescente1',
  amigo:'nino', nene:'nino',
  nina:'nena',
  tia:'mujer', senora:'mujer', seno:'mujer',
  tio:'senor', hombre:'senor',
  vieja:'abuela', viejita:'abuela',
  viejo:'abuelo', viejito:'abuelo'
};

const Img = (() => {
  /** DULCE DE LECHE → dulce-de-leche · PIZARRÓN → pizarron */
  function slug(texto){
    return BANCO.sinAcento(String(texto))
      .toLowerCase().replace(/ñ/g,'n').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  }

  /** Como slug(), pero si la palabra tiene un alias a otro archivo (ver
      ALIAS_IMG), devuelve el slug de ESE archivo en vez del propio. */
  function slugPropia(texto){
    const s = slug(texto);
    return ALIAS_IMG[s] || s;
  }

  /** Código de reserva de la categoría de una palabra */
  function reserva(p){
    const c = BANCO.CATEGORIAS[p.cat];
    if (!c) return '2753';                                   // signo de pregunta
    if (typeof c.reserva === 'object') return c.reserva[p.genero || 'x'] || c.reserva.x;
    return c.reserva;
  }

  /** Se llama desde el onerror del <img>: prueba el siguiente candidato */
  function fallo(el){
    const cola = (el.dataset.cola || '').split('|').filter(Boolean);
    if (!cola.length){ el.style.visibility = 'hidden'; return; }
    el.dataset.cola = cola.slice(1).join('|');
    el.src = cola[0];
  }

  return {
    slug, reserva, fallo,

    /** ¿Esta palabra se puede dibujar? (para elegir juegos con o sin dibujo) */
    tiene(p){ return !!(p && (p.twemoji || IMAGENES_PROPIAS.has(slugPropia(p.texto)))); },

    /** HTML de la imagen de una palabra del banco.
        Los COLORES llevan un círculo del color real en vez de dibujo.
        ROSA y NARANJA tienen dibujo propio (🌹 y 🍊), así que por defecto
        muestran el dibujo; el juego de colores pasa {comoColor:true} para
        forzar el círculo. */
    html(p, clases = 'w-20 h-20', { comoColor = false } = {}){
      if (!p) return '';
      if (p.esColor || (comoColor && COLORES_CSS[p.plano])){
        const c = COLORES_CSS[p.plano] || '#CBD5E1';
        const borde = ['BLANCO','BLANCOS','BLANCA','BLANCAS'].includes(p.plano) ? '#94A3B8' : 'rgba(0,0,0,.25)';
        return `<span class="${clases} inline-block rounded-full" aria-label="${p.texto}"
                 style="background:${c};border:4px solid ${borde}"></span>`;
      }
      const cola = [];
      if (p.twemoji) cola.push(`img/twemoji/${p.twemoji}.svg`);
      cola.push(`img/twemoji/${reserva(p)}.svg`);
      return `<img class="${clases} inline-block object-contain" alt="${p.texto}"
               src="img/propias/${slugPropia(p.texto)}.png"
               data-cola="${cola.join('|')}"
               onerror="MOTOR.Img.fallo(this)">`;
    }
  };
})();

/* Colores reales para las palabras de la categoría COLORES */
const COLORES_CSS = {

  AZUL:'#2563EB', AZULES:'#2563EB',

const Perfil = (() => {

    actual(){ return ALM.get(CLAVE) || null; },

})();

   Clave:  bb_p_<PERFIL>_<area>     (sin perfil: bb_p_INVITADO_<area>)
   ================================================================== */
const AREAS = [
  { id:'lectoescritura',  nombre:'LECTOESCRITURA',    emoji:'📚', color:'bg-cielo',    archivo:'lectoescritura.html' },
  { id:'logica',          nombre:'LÓGICA',            emoji:'🧩', color:'bg-rosa',     archivo:'logica.html' },

const Puntaje = (() => {
  let area = null, sesion = 0, alCambiar = null;
  const clave = (a, quien) => 'bb_p_' + (quien || Perfil.actual() || 'INVITADO') + '_' + a;

  return {
    /** Arranca a contar en un área */
    empezar(a, onCambio){ area = a; sesion = 0; alCambiar = onCambio || null; if (alCambiar) alCambiar(0); },
    sumar(n = 1){
      if (!area) return;
      sesion += n;
      ALM.set(clave(area), String(this.leer(area) + n));
      if (alCambiar) alCambiar(sesion);
    },
    sesion(){ return sesion; },
    reiniciarSesion(){ sesion = 0; if (alCambiar) alCambiar(0); },
    /** Estrellas acumuladas de un área (del chico que esté jugando) */
    leer(a, quien){ return parseInt(ALM.get(clave(a, quien)) || '0', 10) || 0; },
    /** Total de las 7 áreas */
    total(quien){ return AREAS.reduce((s, a) => s + this.leer(a.id, quien), 0); },
    borrarTodo(quien){ AREAS.forEach(a => ALM.quitar(clave(a.id, quien))); }
  };
})();

/* ---------- 🌎 INGLÉS: números y acciones ---------- */
/* Nombres de los números del 1 al 100 en inglés, generados con las reglas
   normales (ONE, ..., NINETEEN, TWENTY, TWENTY-ONE, ..., ONE HUNDRED),
   en vez de escribirlos todos a mano. NUMEROS_EN[n-1] da el nombre del n. */
const UNIDADES_EN = ['','ONE','TWO','THREE','FOUR','FIVE','SIX','SEVEN','EIGHT','NINE'];
const DIECES_EN = ['TEN','ELEVEN','TWELVE','THIRTEEN','FOURTEEN','FIFTEEN','SIXTEEN','SEVENTEEN','EIGHTEEN','NINETEEN'];
const DECENAS_EN = ['','','TWENTY','THIRTY','FORTY','FIFTY','SIXTY','SEVENTY','EIGHTY','NINETY'];
function numeroEnIngles(n){
  if (n === 100) return 'ONE HUNDRED';
  if (n < 10) return UNIDADES_EN[n];
  if (n < 20) return DIECES_EN[n - 10];
  const d = Math.floor(n / 10), u = n % 10;
  return DECENAS_EN[d] + (u ? '-' + UNIDADES_EN[u] : '');
}
const NUMEROS_EN = Array.from({ length:100 }, (_, i) => numeroEnIngles(i + 1));

/* Trazos previos: para los más chiquitos, antes de las letras.
   Las curvas se arman con muchos tramos cortos. */
function curva(f, n = 26){
  const p = [];
  for (let i = 0; i <= n; i++) p.push(f(i / n));
  return p.slice(0, -1).map((a, i) => [a, p[i + 1]]);
}

/** Palabras con dibujo y de largo razonable, listas para jugar */
function palabrasJugables({ cat = null, minSil = 0, maxSil = 9, conDibujo = true } = {}){
  return BANCO.filtrar({ cat, conDibujo: conDibujo ? null : null })
    .filter(p => (conDibujo ? (p.twemoji || true) : true))
    .filter(p => !p.esColor && p.cat !== 'nombres' && !p.texto.includes(' '))
    .filter(p => { const n = Silabas.separar(p.texto).length; return n >= minSil && n <= maxSil; });
}

  function refrescarCara(){

function jArmarSilabas(){
  const candidatas = BANCO.PALABRAS.filter(p =>
    Img.tiene(p) && !p.texto.includes(' ') && p.cat !== 'nombres');
  const p = alAzar(candidatas);
  const sil = Silabas.separar(p.texto);
  const sobra = tomar(['PA','TO','LE','MI','SU','RO','NA','TE','LU','SI'].filter(s => !sil.includes(s)), 2);

  vista.innerHTML = `
    <div class="text-center">
      ${UI.consigna('ARMÁ LA PALABRA','ARRASTRÁ LAS SÍLABAS A SU LUGAR')}
      <div class="my-4">${UI.escena(dibujo(p, 'w-24 h-24 sm:w-28 sm:h-28'))}</div>
      <div class="flex flex-wrap justify-center gap-2 my-4">
        ${sil.map((_, i) => `<div class="zz w-20 h-20 sm:w-24 sm:h-24 rounded-3xl bg-cielo/25
          border-4 border-dashed border-cielo flex items-center justify-center
          font-titulo font-extrabold text-2xl transition-transform" data-i="${i}"></div>`).join('')}
      </div>
      <div class="bg-crema rounded-3xl p-3 border-4 border-amarillo/60">
        <p class="font-titulo font-bold text-tinta/60 text-sm mb-2">BANCO DE SÍLABAS</p>
        <div class="flex flex-wrap justify-center gap-2">
          ${mezclar([...sil, ...sobra]).map(s => `<div class="ff btn3d bg-amarillo rounded-3xl px-4 py-3
            min-w-[4.5rem] font-titulo font-extrabold text-2xl" data-val="${s}">${s}</div>`).join('')}
        </div>
      </div>
      ${UI.barra({ textoSiguiente:'OTRA PALABRA ➡️' })}
    </div>`;

  let ok = 0;
  vista.querySelectorAll('.zz').forEach(z => Drag.zona(z));
  vista.querySelectorAll('.ff').forEach(f => { Drag.ficha(f);
    f.addEventListener('click', () => Voz.hablar(f.dataset.val)); });

  Drag.alSoltar((z, f) => {
    if (!z.matches('.zz') || z.dataset.ok) return;
    if (f.dataset.val === sil[+z.dataset.i]){
      z.textContent = f.dataset.val; z.dataset.ok = 1;
      z.classList.remove('bg-cielo/25','border-dashed');
      z.classList.add('bg-verde','border-solid','pop');
      f.classList.add('invisible','pointer-events-none');
      Sonido.ok(); Voz.hablar(f.dataset.val); Puntaje.sumar(1);
      if (++ok === sil.length){ Puntaje.sumar(2);
        // Pausa para que se escuche primero la sílaba, después la palabra entera,
        // y recién ahí entra el festejo (fanfarria + "¡MUY BIEN!") sin pisarse.
        setTimeout(() => {
          Voz.hablar(p.texto);
          setTimeout(() => UI.festejar(p.texto, jArmarSilabas), 900);
        }, 550);
      }
    } else UI.error(z);
  });

  UI.conectarBarra({ escuchar:() => Voz.hablar(p.texto), siguiente:jArmarSilabas, menu:volverAlMenu });
  Voz.hablar(p.texto);
}

/* ==================================================================
   📚 LECTOESCRITURA 2 · CREÁ PALABRAS (TECLADO DE SÍLABAS)
   ================================================================== */
const V = ['A','E','I','O','U'];
/* Consonantes en orden alfabético (orden "de cartilla" clásico, con CH/LL/Ñ
   como letras propias). Cada una arma su propia tanda de sílabas:
   vocales sueltas, después sílabas trabadas con R, después con L. */
const CONSONANTES = ['B','C','CH','D','F','G','H','J','L','LL','M','N','Ñ','P','Q','R','RR','S','T','V','Y','Z'];
const CLUSTER_R = ['B','C','D','F','G','P','T'];   // BR CR DR FR GR PR TR
const CLUSTER_L = ['B','C','F','G','P','T'];        // BL CL FL GL PL TL
function silabasDe(c){
  if (c === 'Q') return ['QUE','QUI'];                                   // QUA/QUO no existen en español
  let s = c === 'G' ? ['GA','GE','GI','GO','GU','GUE','GUI'] : V.map(v => c + v);
  if (CLUSTER_R.includes(c)) s = s.concat(V.map(v => c + 'R' + v));
  if (CLUSTER_L.includes(c)) s = s.concat(V.map(v => c + 'L' + v));
  return s;
}
/* Terminaciones comunes, para completar palabras (GIRA+SOL, BO+TÓN, ORA+CIÓN...) */
const TERMINACIONES = ['SOL','AR','AL','AN','EL','ON','AS','ES','GÓN','TÓN','ZÓN','CIO','CIÓN',
  'BOL','VIÓN','MÓN','LÓN'];

/* Letras sueltas, en el orden clásico del abecedario de cartilla (con CH/LL/RR/Ñ). */
const LETRAS_SUELTAS = ['A','B','C','CH','D','E','F','G','H','I','J','K','L','LL','M','N','Ñ',
  'O','P','Q','R','RR','S','T','U','V','W','X','Y','Z'];

/* Sílabas inversas: vocal + consonante (N, R o S), el otro orden posible de la sílaba
   además de consonante+vocal. Completan el set fonético básico. */
const SILABAS_INVERSAS = ['AN','EN','IN','ON','UN','AR','ER','IR','OR','UR','AS','ES','IS','OS','US'];

/* Grupos consonánticos "cultos": aparecen en palabras más largas (OBJETO, SUBVENCIÓN,
   TRANSPORTE) y los chicos más grandes ya los reconocen como bloque. */
const GRUPOS_CONSONANTICOS = ['MB','NV','BV','DV','SUBV','BS','BD','BT','BJ','PS','PT','PN'];

/* Un único teclado, en una sola columna: letras sueltas → vocales → consonantes A-Z →
   sílabas inversas → grupos consonánticos → terminaciones. */
const GRUPOS_TECLADO = [
  { titulo:'LETRAS SUELTAS', silabas: LETRAS_SUELTAS },
  { titulo:'VOCALES', silabas: V },
  ...CONSONANTES.map(c => ({ titulo:c, silabas: silabasDe(c) })),
  { titulo:'SÍLABAS INVERSAS', silabas: SILABAS_INVERSAS },
  { titulo:'GRUPOS CONSONÁNTICOS', silabas: GRUPOS_CONSONANTICOS },
  { titulo:'TERMINACIONES', silabas: TERMINACIONES, esFinal:true }
];

/* Paleta de colores por grupo de teclado — a pedido de Tamara ("le falta
   color"), inspirada en el HTML de referencia que le encanta a Bruno:
   cada letra/grupo tiene su propio color (fondo del botón Y de la ficha
   cuando se arma la palabra), en vez de que todo el teclado sea amarillo. */
const COLORES_TECLADO = [
  '#FF6B35','#845EC2','#0097A7','#388E3C','#C2185B','#2E7D32','#558B2F','#F57F17',
  '#AD1457','#E65100','#BF360C','#6A1B9A','#006064','#880E4F','#1B5E20','#F9A825',
  '#00838F','#004D40','#E64A19','#4527A0','#33691E','#01579B','#B71C1C','#827717'
];

function jCrearPalabras(){
  /* armada ahora es un ARRAY de fichas {t, c} (texto + color), no un string

          </div>
        </div>

      </div>`;

    vista.querySelectorAll('[data-s]').forEach(b => b.addEventListener('click', () => {
      const s = b.dataset.s;

      // Si es una letra suelta (A, CH, LL...) decimos su NOMBRE (be, che, elle),

      Voz.hablar(NOMBRE_LETRA[s] || s);

    pz.innerHTML = armada.length ? armada.map(f => `<span class="font-titulo font-extrabold text-2xl sm:text-3xl
      rounded-xl px-2 py-0.5 text-white pop" style="background:${f.c}">${f.t}</span>`).join('')
      : '<span class="text-tinta/25 font-bold">TOCÁ LAS SÍLABAS ↓</span>';
    vista.querySelector('#aviso').textContent = '';
  }

  function probar(){
    const texto = textoArmado();
    if (texto.length < 2) return;
    const p = BANCO.buscar(texto);
    const aviso = vista.querySelector('#aviso');
    if (p && !encontradas.includes(p.texto)){
      encontradas.push(p.texto);
      ALM.set('bb_encontradas', JSON.stringify(encontradas));
      Puntaje.sumar(3);
      Voz.hablar(p.texto);
      UI.festejar(`${p.texto}<div class="mt-2">${dibujo(p, 'w-20 h-20')}</div>`, () => { armada = []; pintar(); });
    } else if (p){
      aviso.innerHTML = '<span class="text-cielo">✅ ' + p.texto + ' — YA LA HABÍAS ENCONTRADO</span>';
      Sonido.ok(); Voz.hablar(p.texto);
    } else {
      aviso.innerHTML = '<span class="text-tinta/50">ESA PALABRA NO EXISTE. ¡SEGUÍ PROBANDO!</span>';
      UI.error(vista.querySelector('#pizarra'));
    }
  }
  pintar();
  Voz.hablar('armá una palabra con las sílabas');
}

/* ==================================================================
   🧩 LÓGICA 1 · ROMPECABEZAS (usa las escenas hechas con IA)
   Ahora se elige el dibujo Y la cantidad de piezas antes de empezar,
   así el mismo dibujo se puede armar fácil o difícil.
   ================================================================== */
/* maxW = ancho máx. de la grilla (más piezas → grilla más chica, para que
   entre en la pantalla sin hacer scroll vertical). tam = tamaño de cada
   ficha en el banco de piezas de abajo (en rem, ancho x alto 4:3). */
const DIFICULTADES_PUZZLE = [
  { id:'4',  nombre:'4 PIEZAS',  F:2, C:2, maxW:16, tam:6.5 },
  { id:'6',  nombre:'6 PIEZAS',  F:2, C:3, maxW:20, tam:5.5 },
  { id:'12', nombre:'12 PIEZAS', F:3, C:4, maxW:20, tam:4.4 },
  { id:'20', nombre:'20 PIEZAS', F:4, C:5, maxW:18, tam:3.6 }
];

function jPuzzle(){
  let escElegida = alAzar(ESCENAS), difElegida = DIFICULTADES_PUZZLE[1];

  function pintarSelector(){
    vista.innerHTML = `
      <div class="text-center">
        ${UI.consigna('ARMÁ EL ROMPECABEZAS','ELEGÍ EL DIBUJO Y CUÁNTAS PIEZAS QUERÉS')}
        <div class="grid grid-cols-3 sm:grid-cols-5 gap-2 my-4 max-w-xl mx-auto">
          ${ESCENAS.map(e => `<button data-e="${e.archivo}" class="be btn3d rounded-2xl p-1 border-4
            ${e.archivo === escElegida.archivo ? 'border-verde' : 'border-transparent'}">
            <div class="aspect-[4/3] rounded-xl" style="background-image:url('img/propias/${e.archivo}');
              background-size:cover;background-position:center"></div>
            <div class="font-titulo font-extrabold text-[10px] sm:text-xs mt-1">${e.nombre}</div>
          </button>`).join('')}
        </div>
        <p class="font-titulo font-bold text-tinta/50 text-sm mb-2">¿CUÁNTAS PIEZAS?</p>
        <div class="flex flex-wrap justify-center gap-2 mb-5">
          ${DIFICULTADES_PUZZLE.map(d => `<button data-d="${d.id}" class="bd btn3d rounded-2xl px-4 py-3
            font-titulo font-extrabold ${d.id === difElegida.id ? 'bg-verde' : 'bg-white border-2 border-tinta/10'}">${d.nombre}</button>`).join('')}
        </div>
        <div class="flex flex-wrap justify-center gap-3">
          <button id="bEmpezar" class="btn3d bg-amarillo rounded-3xl px-8 py-4 font-titulo font-extrabold text-lg">▶️ EMPEZAR</button>
          <button id="bb-menu" class="btn3d bg-white border-2 border-tinta/10 rounded-3xl px-6 py-4 font-titulo font-bold">🏠 MENÚ</button>
        </div>
      </div>`;

    vista.querySelectorAll('.be').forEach(b => b.addEventListener('click', () => {
      escElegida = ESCENAS.find(e => e.archivo === b.dataset.e); Sonido.toque(); pintarSelector();
    }));
    vista.querySelectorAll('.bd').forEach(b => b.addEventListener('click', () => {
      difElegida = DIFICULTADES_PUZZLE.find(d => d.id === b.dataset.d); Sonido.toque(); pintarSelector();
    }));
    vista.querySelector('#bEmpezar').addEventListener('click', () => jugar(escElegida, difElegida));
    vista.querySelector('#bb-menu').addEventListener('click', volverAlMenu);
  }

  function jugar(esc, dif){
    const { F, C, maxW, tam } = dif;
    const piezas = [];
    for (let f = 0; f < F; f++) for (let c = 0; c < C; c++) piezas.push({ f, c, i:f*C + c });

    const estilo = pz => `background-image:url('img/propias/${esc.archivo}');
      background-size:${C * 100}% ${F * 100}%;
      background-position:${(pz.c / (C-1)) * 100}% ${(pz.f / (F-1)) * 100}%;`;

    /* Con muchas piezas (12 y 20) el banco de piezas ya no envuelve en
       varias filas (eso era lo que obligaba a hacer scroll vertical y
       Tamara lo marcó como bug): pasa a ser una sola fila que se
       desliza de costado, como un estante. Con pocas piezas (4 y 6)
       entran todas igual, así que se quedan envueltas y centradas. */
    const banco = piezas.length > 6
      ? `<div class="flex flex-nowrap overflow-x-auto scroll-x gap-1.5 px-1 pb-1" style="scrollbar-width:thin">
          ${mezclar([...piezas]).map(pz => `<div class="fp btn3d rounded-xl bg-cover shrink-0"
            data-val="${pz.i}" style="${estilo(pz)}width:${tam}rem;height:${tam * 0.75}rem"></div>`).join('')}
        </div>`
      : `<div class="flex flex-wrap justify-center gap-1.5">
          ${mezclar([...piezas]).map(pz => `<div class="fp btn3d rounded-xl bg-cover"
            data-val="${pz.i}" style="${estilo(pz)}width:${tam}rem;height:${tam * 0.75}rem"></div>`).join('')}
        </div>`;

    vista.innerHTML = `
      <div class="text-center">
        ${UI.consigna('ARMÁ EL ROMPECABEZAS', esc.nombre + ' · ' + dif.nombre + ' · ARRASTRÁ CADA PIEZA A SU LUGAR')}
        <div class="mx-auto my-3 grid gap-1 bg-cielo/20 p-2 rounded-3xl border-4 border-dashed border-cielo"
             style="grid-template-columns:repeat(${C},1fr);max-width:${maxW}rem">
          ${piezas.map(pz => `<div class="zp aspect-[4/3] rounded-xl bg-white/60 transition-transform"
            data-i="${pz.i}"></div>`).join('')}
        </div>
        <div class="bg-crema rounded-3xl p-2 border-4 border-amarillo/60">
          <p class="font-titulo font-bold text-tinta/60 text-sm mb-2">LAS PIEZAS${piezas.length > 6 ? ' (DESLIZÁ) →' : ''}</p>
          ${banco}
        </div>
        ${UI.barra({ escuchar:false, textoSiguiente:'OTRO ➡️' })}
      </div>`;

    let ok = 0;
    vista.querySelectorAll('.zp').forEach(z => Drag.zona(z));
    vista.querySelectorAll('.fp').forEach(f => Drag.ficha(f));

    Drag.alSoltar((z, f) => {
      if (!z.matches('.zp') || z.dataset.ok) return;
      if (z.dataset.i === f.dataset.val){
        // Copiamos SOLO lo del fondo, no el ancho ni el alto de la ficha:
        // la zona tiene que conservar su tamaño dentro de la grilla.
        const pz = piezas[+z.dataset.i];
        z.style.backgroundImage    = `url('img/propias/${esc.archivo}')`;
        z.style.backgroundSize     = `${C * 100}% ${F * 100}%`;
        z.style.backgroundPosition = `${(pz.c / (C-1)) * 100}% ${(pz.f / (F-1)) * 100}%`;
        z.classList.add('pop'); z.classList.remove('bg-white/60');
        z.dataset.ok = 1;
        f.classList.add('invisible','pointer-events-none');
        Sonido.ok(); Puntaje.sumar(1);
        if (++ok === piezas.length){ Puntaje.sumar(3);
          Voz.hablar('armaste ' + esc.nombre);
          UI.festejar(esc.nombre, pintarSelector); }
      } else UI.error(z);
    });
    UI.conectarBarra({ siguiente:pintarSelector, menu:volverAlMenu });
    Voz.hablar('armá el rompecabezas de ' + esc.nombre);
  }

  pintarSelector();
}

/* ==================================================================
   🧩 LÓGICA 2 · MEMORIA
   Ahora se elige antes de jugar: cuántas parejas, y si las cartas
   muestran dibujos o palabras.
   ================================================================== */
const OPCIONES_MEMO_PARES = [4, 6, 8, 10];
const OPCIONES_MEMO_MODO = [
  { id:'imagenes', nombre:'🖼️ DIBUJOS',  consigna:'UNÍ CADA DIBUJO CON SU IGUAL' },
  { id:'palabras', nombre:'🔤 PALABRAS', consigna:'UNÍ CADA PALABRA CON SU DIBUJO' }
];

function jMemo(){
  let paresElegidos = 6, modoElegido = 'imagenes';

  function pintarSelector(){
    vista.innerHTML = `
      <div class="text-center">
        ${UI.consigna('JUEGO DE MEMORIA','ELEGÍ EL MODO Y CUÁNTAS PAREJAS')}
        <p class="font-titulo font-bold text-tinta/50 text-sm mb-2">MODO</p>
        <div class="flex flex-wrap justify-center gap-2 mb-4">
          ${OPCIONES_MEMO_MODO.map(m => `<button data-m="${m.id}" class="bm btn3d rounded-3xl px-5 py-4
            font-titulo font-extrabold ${m.id === modoElegido ? 'bg-verde' : 'bg-white border-2 border-tinta/10'}">
            ${m.nombre}</button>`).join('')}
        </div>
        <p class="font-titulo font-bold text-tinta/50 text-sm mb-2">¿CUÁNTAS PAREJAS?</p>
        <div class="flex flex-wrap justify-center gap-2 mb-5">
          ${OPCIONES_MEMO_PARES.map(n => `<button data-n="${n}" class="bn btn3d rounded-2xl px-5 py-3
            font-titulo font-extrabold ${n === paresElegidos ? 'bg-cielo' : 'bg-white border-2 border-tinta/10'}">${n} PAREJAS</button>`).join('')}
        </div>
        <div class="flex flex-wrap justify-center gap-3">
          <button id="bEmpezar" class="btn3d bg-amarillo rounded-3xl px-8 py-4 font-titulo font-extrabold text-lg">▶️ EMPEZAR</button>
          <button id="bb-menu" class="btn3d bg-white border-2 border-tinta/10 rounded-3xl px-6 py-4 font-titulo font-bold">🏠 MENÚ</button>
        </div>
      </div>`;

    vista.querySelectorAll('.bm').forEach(b => b.addEventListener('click', () => {
      modoElegido = b.dataset.m; Sonido.toque(); pintarSelector();
    }));
    vista.querySelectorAll('.bn').forEach(b => b.addEventListener('click', () => {
      paresElegidos = +b.dataset.n; Sonido.toque(); pintarSelector();
    }));
    vista.querySelector('#bEmpezar').addEventListener('click', () => jugar(paresElegidos, modoElegido));
    vista.querySelector('#bb-menu').addEventListener('click', volverAlMenu);
  }

  function jugar(n, modo){
    const elegidas = tomar(BANCO.PALABRAS.filter(p =>
      Img.tiene(p) && !p.texto.includes(' ') && p.cat !== 'nombres' && p.largo <= 8), n);
    const info = OPCIONES_MEMO_MODO.find(m => m.id === modo);

    // En modo "palabras" cada pareja es UNA carta con el dibujo y OTRA con la
    // palabra escrita (no dos iguales), así se relaciona la imagen con su nombre.
    const cartas = mezclar(elegidas.flatMap(p => modo === 'palabras'
      ? [{ par:p.plano, tipo:'img', p }, { par:p.plano, tipo:'txt', p }]
      : [{ par:p.plano, tipo:'img', p }, { par:p.plano, tipo:'img', p }]));

    vista.innerHTML = `
      <div class="text-center">
        ${UI.consigna('JUEGO DE MEMORIA', info.consigna)}
        <div class="grid grid-cols-4 gap-2 max-w-lg mx-auto my-5">
          ${cartas.map((c, i) => `<button class="cm aspect-square rounded-3xl bg-rosa btn3d
            flex items-center justify-center p-1" data-i="${i}" data-par="${c.par}">
            <span class="cara text-3xl sm:text-4xl">❓</span></button>`).join('')}
        </div>
        ${UI.barra({ escuchar:false, textoSiguiente:'OTRA VUELTA ➡️' })}
      </div>`;

    const dom = [...vista.querySelectorAll('.cm')];
    let abiertas = [], bloqueado = false, pares = 0;

    dom.forEach((b, i) => b.addEventListener('click', () => {
      if (bloqueado || b.dataset.ok || abiertas.includes(b)) return;
      const c = cartas[i];
      const cara = b.querySelector('.cara');
      cara.innerHTML = c.tipo === 'img'
        ? dibujo(c.p, 'w-10 h-10 sm:w-12 sm:h-12')
        : `<span class="font-titulo font-extrabold text-[10px] sm:text-sm leading-tight">${c.p.texto}</span>`;
      b.classList.add('pop');
      Voz.hablar(c.p.texto);
      abiertas.push(b);

      if (abiertas.length === 2){
        const [x, y] = abiertas;
        if (x.dataset.par === y.dataset.par){
          x.dataset.ok = y.dataset.ok = 1;
          [x, y].forEach(e => { e.classList.remove('bg-rosa'); e.classList.add('bg-verde'); });
          Sonido.ok(); Puntaje.sumar(2); abiertas = [];
          if (++pares === elegidas.length){ Puntaje.sumar(2); UI.festejar('¡TODAS LAS PAREJAS!', pintarSelector); }
        } else {
          bloqueado = true; Sonido.error();
          [x, y].forEach(e => e.classList.add('shake'));
          setTimeout(() => {
            [x, y].forEach(e => { e.classList.remove('shake'); e.querySelector('.cara').innerHTML = '❓'; });
            abiertas = []; bloqueado = false;
          }, 900);
        }
      }
    }));
    UI.conectarBarra({ siguiente:pintarSelector, menu:volverAlMenu });
  }

  pintarSelector();
}

/* ==================================================================
   🌎 INGLÉS 1 · LISTEN AND CHOOSE
   ================================================================== */
function jListen(){
  const correcta = alAzar(INGLES);
  const opciones = mezclar([correcta, ...tomar(INGLES.filter(x => x.en !== correcta.en), 2)]);

  vista.innerHTML = `
    <div class="text-center">
      ${UI.consigna('LISTEN AND CHOOSE','ESCUCHÁ Y TOCÁ EL DIBUJO CORRECTO')}
      <button id="bRep" class="btn3d bg-amarillo rounded-3xl px-8 py-6 my-5
        font-titulo font-extrabold text-2xl sm:text-3xl">🔊 ${correcta.en}</button>
      <div class="grid grid-cols-3 gap-3 max-w-lg mx-auto">
        ${opciones.map(o => {
          const p = BANCO.buscar(o.es);
          return `<button class="op aspect-square rounded-3xl bg-cielo btn3d flex items-center
            justify-center p-3" data-ok="${o.en === correcta.en}" data-en="${o.en}">${dibujo(p,'w-full h-full')}</button>`;
        }).join('')}
      </div>
      ${UI.barra({ textoSiguiente:'NEXT ➡️' })}
    </div>`;

  const decir = () => Voz.hablar(correcta.en, 'en');
  vista.querySelector('#bRep').addEventListener('click', decir);
  vista.querySelectorAll('.op').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.ok === 'true'){
      b.classList.remove('bg-cielo'); b.classList.add('bg-verde','pop');
      Sonido.ok(); Puntaje.sumar(2);
      setTimeout(decir, 250);
      UI.festejar(correcta.en + ' = ' + correcta.es, jListen);
    } else {
      // No alcanza con el sonido de error: hay que decir qué era lo que tocó,
      // para que el chico entienda su propio error, no solo que se equivocó.
      UI.error(b);
      Voz.hablar(b.dataset.en, 'en');
    }
  }));
  UI.conectarBarra({ escuchar:decir, siguiente:jListen, menu:volverAlMenu });
  setTimeout(decir, 500);
}

/* ==================================================================
   🌎 INGLÉS 2 · MATCH THE WORD
   ================================================================== */
function jMatch(){
  const tres = tomar(INGLES, 3);

  vista.innerHTML = `
    <div class="text-center">
      ${UI.consigna('MATCH THE WORD','ARRASTRÁ CADA PALABRA A SU DIBUJO')}
      <div class="flex flex-wrap justify-center gap-2 my-4">
        ${mezclar([...tres]).map(o => `<div class="fw btn3d bg-amarillo rounded-3xl px-4 py-3
          font-titulo font-extrabold text-xl" data-val="${o.en}">${o.en}</div>`).join('')}
      </div>
      <div class="grid grid-cols-3 gap-3 max-w-lg mx-auto">
        ${tres.map(o => {
          const p = BANCO.buscar(o.es);
          return `<div class="zw rounded-3xl bg-cielo/25 border-4 border-dashed border-cielo p-3
            transition-transform" data-val="${o.en}" data-es="${o.es}">
            ${dibujo(p,'w-full h-16 sm:h-20')}
            <div class="destino font-titulo font-extrabold text-sm mt-1 min-h-[1.25rem]"></div>
          </div>`;
        }).join('')}
      </div>
      ${UI.barra({ escuchar:false, textoSiguiente:'NEXT ➡️' })}
    </div>`;

  let ok = 0;
  vista.querySelectorAll('.zw').forEach(z => { Drag.zona(z);
    // Tocar el dibujo dice su nombre EN INGLÉS (igual que las fichas escritas),
    // así el chico que ya sabe leer relaciona la palabra escrita con el sonido
    // en inglés del dibujo, en vez de mezclarlo con el español.
    z.addEventListener('click', () => Voz.hablar(z.dataset.val, 'en')); });
  vista.querySelectorAll('.fw').forEach(f => { Drag.ficha(f);
    f.addEventListener('click', () => Voz.hablar(f.dataset.val, 'en')); });

  Drag.alSoltar((z, f) => {
    if (!z.matches('.zw') || z.dataset.ok) return;
    if (z.dataset.val === f.dataset.val){
      z.querySelector('.destino').textContent = f.dataset.val;
      z.dataset.ok = 1;
      z.classList.remove('bg-cielo/25','border-dashed');
      z.classList.add('bg-verde','border-solid','pop');
      f.classList.add('invisible','pointer-events-none');
      Sonido.ok(); Puntaje.sumar(2);
      // No alcanza con leer la palabra en inglés: hay que nombrar también
      // el dibujo, primero en inglés y después en español.
      Voz.hablar(f.dataset.val, 'en');
      setTimeout(() => Voz.hablar(z.dataset.es, 'es'), 700);
      if (++ok === tres.length) setTimeout(() => UI.festejar('VERY GOOD!', jMatch), 1400);
    } else UI.error(z);
  });
  UI.conectarBarra({ siguiente:jMatch, menu:volverAlMenu });
}

/* ==================================================================
   🔢 MATEMÁTICA 1 · ¿CUÁNTOS HAY?

function jContar(){
  const p = alAzar(BANCO.PALABRAS.filter(x => x.cat === 'comidas' && Img.tiene(x))
    .concat(BANCO.PALABRAS.filter(x => x.cat === 'animales' && Img.tiene(x))));

      ${UI.consigna('¿CUÁNTOS HAY?','ARRASTRÁ EL NÚMERO CORRECTO')}
      <div class="bg-crema rounded-3xl border-4 border-verde/60 p-4 my-4 flex flex-wrap
        justify-center items-center gap-1">
        ${Array.from({length:n}, () => dibujo(p, 'w-12 h-12 sm:w-14 sm:h-14')).join('')}
      </div>
      <div class="flex justify-center my-4">
        <div id="zn" class="w-24 h-24 rounded-3xl bg-verde/25 border-4 border-dashed border-verde
          flex items-center justify-center font-titulo font-extrabold text-4xl transition-transform">?</div>
      </div>
      <div class="flex flex-wrap justify-center gap-3">
        ${ops.map(x => `<div class="fn btn3d bg-lila rounded-3xl w-20 h-20 flex items-center
          justify-center font-titulo font-extrabold text-4xl" data-val="${x}">${x}</div>`).join('')}
      </div>
      ${UI.barra({ textoSiguiente:'OTRA ➡️' })}
    </div>`;

  const z = vista.querySelector('#zn');
  Drag.zona(z);
  vista.querySelectorAll('.fn').forEach(f => { Drag.ficha(f);
    f.addEventListener('click', () => Voz.hablar(f.dataset.val)); });

  Drag.alSoltar((zona, f) => {

    if (+f.dataset.val === n){
      z.textContent = n; z.dataset.ok = 1;

  UI.conectarBarra({ escuchar:() => Voz.hablar('cuántos hay'), siguiente:jContar, menu:volverAlMenu });

  vista.innerHTML = `

          <div class="flex flex-wrap justify-center gap-1 max-w-[9rem]">${fila(a)}</div>
          <span class="font-titulo font-extrabold text-4xl">+</span>
          <div class="flex flex-wrap justify-center gap-1 max-w-[9rem]">${fila(b)}</div>
          <span class="font-titulo font-extrabold text-4xl">=</span>
          <div id="zs" class="w-20 h-20 rounded-3xl bg-verde/25 border-4 border-dashed border-verde
            flex items-center justify-center font-titulo font-extrabold text-4xl transition-transform">?</div>
        </div>
        <p class="font-titulo font-extrabold text-2xl mt-3 text-tinta/50">${a} + ${b}</p>

/* ==================================================================
   ✏️ CALIGRAFÍA · TRAZAR (letras y números comparten el motor)
   ================================================================== */
function trazar(set, titulo, palabraEntera){
  let i = 0;
  /* IMPORTANTE — fuga de memoria arreglada: pintar() se llama una vez por
     cada letra/trazo (cada "SIGUIENTE" dentro del mismo juego), y antes
     agregaba un listener de 'mouseup' a la ventana SIN sacar el anterior.
     En una sesión larga de caligrafía (27 letras, laberintos, olas, etc.)
     esto acumulaba cientos de listeners fantasma y era la causa más probable
     de que el juego se sintiera cada vez más lento/trabado en el celular.
     Guardamos el último para sacarlo antes de poner el nuevo. */
  let mouseupPrevio = null;
  /* Cómo se nombra lo que hay que trazar, según el juego.
     Para letras usamos el NOMBRE escrito (NOMBRE_LETRA), no el carácter
     solo, para que el sintetizador de voz no lo confunda con el nombre
     de la letra en inglés (ver NOMBRE_LETRA más arriba). */
  const comoSeLlama = ch =>
    titulo === 'LETRAS' || titulo === 'MI NOMBRE' || titulo === 'PALABRAS' ? 'la letra ' + (NOMBRE_LETRA[ch] || ch) :
    titulo === 'TRAZOS' ? 'el trazo ' + ch : 'el ' + ch;

  function pintar(){
    const ch = set[i];
    const guia = TRAZOS[ch] || [];
    const encabezado = titulo === 'TRAZOS' ? 'TRAZÁ: ' + ch
                     : titulo === 'MI NOMBRE' ? 'TU NOMBRE: LETRA ' + ch
                     : titulo === 'PALABRAS' ? 'LA PALABRA ' + palabraEntera + ': LETRA ' + ch
                     : 'TRAZÁ LA ' + (titulo === 'LETRAS' ? 'LETRA ' : '') + ch;

    vista.innerHTML = `
      <div class="text-center">
        ${UI.consigna(encabezado,
            palabraEntera
              ? set.map((c, k) => k === i
                  ? `<span class="text-verde">${c}</span>` : `<span class="text-tinta/30">${c}</span>`).join(' ')
              : titulo === 'TRAZOS' ? `TRAZO ${i + 1} DE ${set.length} · SEGUÍ LOS PUNTITOS CON EL DEDO`
              : 'SEGUÍ LOS PUNTITOS CON EL DEDO · LOS NUMERITOS DICEN EL ORDEN')}
        <div class="flex justify-center my-4">
          <canvas id="cv" width="220" height="220" class="trazo bg-crema rounded-3xl
            border-4 border-cielo shadow-inner touch-none"></canvas>
        </div>
        ${titulo === 'TRAZOS' ? '' : `
        <div class="flex flex-wrap justify-center gap-1.5 mb-3 max-h-32 overflow-y-auto px-1">
          ${set.map((c, k) => `<button data-k="${k}" class="btn3d rounded-2xl font-titulo font-extrabold
            ${c.length > 1 ? 'px-3 py-2 text-sm' : 'w-11 h-11'}
            ${k === i ? 'bg-cielo' : 'bg-white border-2 border-tinta/10'}">${c}</button>`).join('')}
        </div>`}
        <div class="flex flex-wrap justify-center gap-3 no-sel">
          <button id="bBorr" class="btn3d bg-rosa rounded-3xl px-5 py-4 font-titulo font-extrabold">🧽 BORRAR</button>
          <button id="bb-escuchar" class="btn3d bg-amarillo rounded-3xl px-5 py-4 font-titulo font-extrabold">🔊 ESCUCHAR</button>
          <button id="bb-siguiente" class="btn3d bg-verde rounded-3xl px-5 py-4 font-titulo font-extrabold">SIGUIENTE ➡️</button>
          <button id="bb-menu" class="btn3d bg-white border-2 border-tinta/10 rounded-3xl px-5 py-4 font-titulo font-bold">🏠 MENÚ</button>
        </div>
      </div>`;

    const cv = vista.querySelector('#cv'), cx = cv.getContext('2d');
    let pintando = false, ultimo = null, hecho = false;
    // Para el aviso de "te estás saliendo": cuánto lleva dibujado en total y
    // cuánto de eso fue seguido lejos de la guía, sin tocarla.
    let totalDibujado = 0, fueraSeguido = 0, avisadoFuera = false;
    const TOLERANCIA = 40;   // qué tan lejos de la guía puede ir el dedo y seguir contando
    const AVISO_LEJOS = 70;  // cuánto tiene que alejarse SIN volver a la guía para avisar

    function distSegmento(p, a, b){
      const dx = b[0]-a[0], dy = b[1]-a[1];
      const len2 = dx*dx + dy*dy;
      if (!len2) return Math.hypot(p.x-a[0], p.y-a[1]);
      let t = ((p.x-a[0])*dx + (p.y-a[1])*dy) / len2;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(p.x - (a[0]+t*dx), p.y - (a[1]+t*dy));
    }

    /* Los tramos que empiezan donde terminó el anterior son UN solo movimiento
       del lápiz (un solo "trazo"), así que llevan un solo numerito. Por eso la O
       muestra 1 punto de partida y no 4, y la OLA muestra 1 y no 26. */
    const trazos = [];
    guia.forEach(([a, b], k) => {
      const previo = k > 0 ? guia[k-1][1] : null;
      const sigue = previo && Math.hypot(a[0]-previo[0], a[1]-previo[1]) < 3;
      if (!sigue || !trazos.length) trazos.push([]);
      trazos[trazos.length - 1].push([a, b]);
    });
    const arranques = trazos.map(t => t[0][0]);
    const largoDe = segs => segs.reduce((s, [a, b]) => s + Math.hypot(b[0]-a[0], b[1]-a[1]), 0);

    /* En vez de sumar la distancia dibujada cerca de la guía (eso permitía
       "trampa": garabatear mucho en UN solo punto ya superaba el umbral, y
       a la vez un trazo rápido con pocos eventos de mouse podía no sumar
       lo suficiente aunque el chico lo hubiera hecho bien) medimos COBERTURA:
       cada trazo se divide en baldes a lo largo de su largo, y necesitamos
       haber pasado cerca de cada balde al menos una vez, sin importar
       cuántas veces ni qué tan rápido. Así ni el garabato en un punto ni
       un trazo rápido dan un resultado equivocado. */
    const LARGO_BALDE = 12;
    const nBaldes = trazos.map(t => Math.min(20, Math.max(3, Math.round(largoDe(t) / LARGO_BALDE))));
    const cubiertos = nBaldes.map(n => new Array(n).fill(false));
    const UMBRAL_COBERTURA = 0.7;   // % de baldes que hay que haber cubierto

    /* Distancia y posición (0..1 a lo largo del trazo) del punto p al trazo k */
    function distYPosEnTrazo(p, k){
      const segs = trazos[k];
      const total = largoDe(segs) || 1;
      let mejorD = Infinity, mejorPos = 0, acumulado = 0;
      segs.forEach(([a, b]) => {
        const largoSeg = Math.hypot(b[0]-a[0], b[1]-a[1]);
        const d = distSegmento(p, a, b);
        if (d < mejorD){
          const dx = b[0]-a[0], dy = b[1]-a[1];
          const len2 = dx*dx + dy*dy;
          let t = len2 ? ((p.x-a[0])*dx + (p.y-a[1])*dy) / len2 : 0;
          t = Math.max(0, Math.min(1, t));
          mejorD = d; mejorPos = (acumulado + t * largoSeg) / total;
        }
        acumulado += largoSeg;
      });
      return { d:mejorD, pos:mejorPos };
    }

    /** Trazo más cercano al punto p: { k, d, pos } */
    function trazoMasCercano(p){
      let mejorK = -1, mejorD = Infinity, mejorPos = 0;
      trazos.forEach((_, k) => {
        const { d, pos } = distYPosEnTrazo(p, k);
        if (d < mejorD){ mejorD = d; mejorK = k; mejorPos = pos; }
      });
      return { k:mejorK, d:mejorD, pos:mejorPos };
    }

    const cubrir = (k, pos) => {
      const n = nBaldes[k];
      cubiertos[k][Math.min(n - 1, Math.max(0, Math.floor(pos * n)))] = true;
    };
    const coberturaCompleta = () => cubiertos.every(baldes => {
      const hechos = baldes.filter(Boolean).length;
      return hechos / baldes.length >= UMBRAL_COBERTURA;
    });
    const nuncaTocoLaGuia = () => cubiertos.every(baldes => baldes.every(v => !v));

    function dibujarGuia(){
      cx.clearRect(0, 0, 220, 220);
      cx.setLineDash([7, 9]); cx.lineWidth = 13; cx.strokeStyle = '#CBD5E1'; cx.lineCap = 'round';
      guia.forEach(([a, b]) => { cx.beginPath(); cx.moveTo(a[0], a[1]); cx.lineTo(b[0], b[1]); cx.stroke(); });
      cx.setLineDash([]);
      arranques.forEach((a, k) => {
        cx.fillStyle = '#7DD3FC'; cx.beginPath(); cx.arc(a[0], a[1], 11, 0, 7); cx.fill();
        cx.fillStyle = '#fff'; cx.font = 'bold 14px Nunito, sans-serif';
        cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText(k + 1, a[0], a[1] + 1);
      });
    }
    dibujarGuia();

    const punto = e => {
      const r = cv.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return { x:(t.clientX - r.left) * 220 / r.width, y:(t.clientY - r.top) * 220 / r.height };
    };
    const arrancar = e => { e.preventDefault(); pintando = true; ultimo = punto(e); };
    const mover = e => {
      if (!pintando) return; e.preventDefault();
      const q = punto(e);
      const dist = Math.hypot(q.x - ultimo.x, q.y - ultimo.y);
      // Interpolamos puntos intermedios entre el último punto y este: si el
      // dedo se mueve rápido y hay pocos eventos, no queremos perdernos
      // baldes de la guía por saltarnos tramos del camino.
      const pasos = Math.max(1, Math.ceil(dist / 6));
      let enGuiaAlguno = false;
      for (let s = 1; s <= pasos; s++){
        const t = s / pasos;
        const px = ultimo.x + (q.x - ultimo.x) * t, py = ultimo.y + (q.y - ultimo.y) * t;
        const { k, d, pos } = trazoMasCercano({ x:px, y:py });
        if (d < TOLERANCIA && k >= 0){ enGuiaAlguno = true; cubrir(k, pos); }
      }
      // Feedback EN VIVO mientras traza: verde si va sobre la guía, rojo clarito si se sale,
      // así el chico ve si está bien antes de terminar la letra (no solo al final).
      cx.strokeStyle = enGuiaAlguno ? '#4ADE80' : '#FCA5A5'; cx.lineWidth = 11; cx.lineCap = cx.lineJoin = 'round';
      cx.beginPath(); cx.moveTo(ultimo.x, ultimo.y); cx.lineTo(q.x, q.y); cx.stroke();
      totalDibujado += dist;
      if (enGuiaAlguno){ fueraSeguido = 0; avisadoFuera = false; }
      else {
        // Si se aleja mucho de la guía y no vuelve, avisamos (sonido + sacudida) sin
        // frenar el juego: "por ahí no es". Se vuelve a poder avisar si vuelve a pasar.
        fueraSeguido += dist;
        if (!avisadoFuera && fueraSeguido > AVISO_LEJOS){
          avisadoFuera = true; UI.error(cv);
        }
      }
      ultimo = q;
      // OJO: antes exigíamos además terminar cerca del último punto de la guía
      // ("llegoAlFinal"). Eso rompía trazos con más de un tramo dibujados al
      // revés de cómo los pensamos (por ej. la CRUZ: si el chico dibuja la
      // línea horizontal de derecha a izquierda, termina lejos del punto que
      // esperábamos y el juego nunca decía "¡bien!" aunque estuviera perfecto).
      // Ahora alcanza con haber cubierto bien cada trazo, sin importar en qué
      // punto ni en qué dirección se levantó el dedo.
      if (!hecho && coberturaCompleta()){
        hecho = true; Puntaje.sumar(2);
        // En "escribí tu nombre"/"escribí palabras", al llegar a la última letra
        // se festeja la palabra entera (y se la dice en voz alta: si el chico
        // todavía no lee, si no se la decimos no sabe qué palabra escribió).
        const ultima = palabraEntera && i === set.length - 1;
        if (ultima) Puntaje.sumar(4);
        setTimeout(() => Voz.hablar(ultima ? '¡muy bien! escribiste ' + palabraEntera : comoSeLlama(ch)), 300);
        UI.festejar(ultima ? '¡ESCRIBISTE ' + palabraEntera + '!' : ch, siguiente);
      }
    };
    const soltar = () => {
      pintando = false;
      // Si levantó el dedo habiendo garabateado bastante pero SIN tocar la guía
      // ni una vez, avisamos que eso no era lo que había que trazar.
      if (!hecho && totalDibujado > 40 && nuncaTocoLaGuia()) UI.error(cv);
      totalDibujado = 0; fueraSeguido = 0; avisadoFuera = false;
    };

    cv.addEventListener('mousedown', arrancar);
    cv.addEventListener('mousemove', mover);
    if (mouseupPrevio) removeEventListener('mouseup', mouseupPrevio);
    mouseupPrevio = soltar;
    addEventListener('mouseup', mouseupPrevio);
    cv.addEventListener('touchstart', arrancar, { passive:false });
    cv.addEventListener('touchmove', mover, { passive:false });
    cv.addEventListener('touchend', soltar);

    vista.querySelector('#bBorr').addEventListener('click', () => {
      cubiertos.forEach(baldes => baldes.fill(false)); hecho = false; dibujarGuia();
      totalDibujado = 0; fueraSeguido = 0; avisadoFuera = false;
    });
    vista.querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', () => {
      i = +b.dataset.k; pintar();
    }));
    UI.conectarBarra({ escuchar:() => Voz.hablar(
                         titulo === 'PALABRAS' ? 'la palabra ' + palabraEntera + '. ' + comoSeLlama(ch) : comoSeLlama(ch)),
                       siguiente, menu:volverAlMenu });
    Voz.hablar(
      (titulo === 'PALABRAS' && i === 0 ? 'vamos a escribir la palabra ' + palabraEntera + '. ' : '') +
      'trazá ' + comoSeLlama(ch));
  }

  function siguiente(){ i = (i + 1) % set.length; pintar(); }
  pintar();
}

/* ==================================================================
   📚 LECTOESCRITURA 3 · SOPA DE LETRAS
   El chico toca la primera letra y después la última. Si el camino
   entre las dos forma una palabra de la lista, queda marcada.
   ================================================================== */
function jSopa(){
  const N = 8;
  const elegidas = tomar(BANCO.PALABRAS.filter(p =>
    Img.tiene(p) && !p.texto.includes(' ') && p.cat !== 'nombres' &&
    p.plano.length >= 3 && p.plano.length <= 6), 4);

  // Grilla vacía y colocación de las palabras (horizontal o vertical)
  const G = Array.from({length:N}, () => Array(N).fill(''));
  const puestas = [];
  for (const p of elegidas){
    const L = p.plano.split('');
    let colocada = false;
    for (let intento = 0; intento < 120 && !colocada; intento++){
      const horiz = Math.random() < 0.5;
      const f = Math.floor(Math.random() * (horiz ? N : N - L.length + 1));
      const c = Math.floor(Math.random() * (horiz ? N - L.length + 1 : N));
      const cabe = L.every((ch, k) => {
        const y = horiz ? f : f + k, x = horiz ? c + k : c;
        return G[y][x] === '' || G[y][x] === ch;
      });
      if (!cabe) continue;
      L.forEach((ch, k) => { const y = horiz ? f : f + k, x = horiz ? c + k : c; G[y][x] = ch; });
      puestas.push({ palabra:p, ini:[horiz ? f : f, c], fin:[horiz ? f : f + L.length - 1, horiz ? c + L.length - 1 : c], horiz });
      colocada = true;
    }
  }
  // Relleno
  const AZ = 'ABCDEFGHIJLMNOPRSTUVZ';
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++)
    if (!G[y][x]) G[y][x] = AZ[(Math.random() * AZ.length) | 0];

  vista.innerHTML = `
    <div class="text-center">
      ${UI.consigna('SOPA DE LETRAS','ARRASTRÁ EL DEDO DESDE LA PRIMERA LETRA HASTA LA ÚLTIMA')}
      <div id="grillaSopa" class="grid gap-0.5 sm:gap-1 mx-auto my-4 bg-cielo/20 p-2 rounded-3xl touch-none no-sel"
           style="grid-template-columns:repeat(${N},1fr);max-width:24rem">
        ${G.flatMap((fila, y) => fila.map((ch, x) => `
          <button class="ce aspect-square rounded-lg bg-white font-titulo font-extrabold
            text-sm sm:text-lg transition-colors" data-y="${y}" data-x="${x}">${ch}</button>`)).join('')}
      </div>
      <div class="bg-crema rounded-3xl p-3 border-4 border-amarillo/60">
        <p class="font-titulo font-bold text-tinta/60 text-sm mb-2">BUSCÁ ESTAS ${puestas.length}</p>
        <div class="flex flex-wrap justify-center gap-2">
          ${puestas.map(q => `<div class="pd bg-white rounded-2xl px-2 py-1 flex items-center gap-1.5
            border-2 border-tinta/10" data-p="${q.palabra.plano}">
            ${dibujo(q.palabra,'w-7 h-7')}
            <span class="font-titulo font-extrabold text-sm">${q.palabra.texto}</span></div>`).join('')}
        </div>
      </div>
      ${UI.barra({ escuchar:false, textoSiguiente:'OTRA SOPA ➡️' })}
    </div>`;

  const celda = (y, x) => vista.querySelector(`.ce[data-y="${y}"][data-x="${x}"]`);
  const grilla = vista.querySelector('#grillaSopa');
  let halladas = 0;
  // "pendiente" sostiene una celda elegida con un toque suelto (sin arrastre),
  // para que también funcione tocando primera letra y después la última,
  // además del gesto de arrastrar el dedo (el habitual en un buscapalabras).
  let pendiente = null, arrastrando = false, inicio = null, actual = null;

  /** Sólo permite línea recta (fila u columna) desde el inicio */
  function pathEntre(b1, b2){
    const y1 = +b1.dataset.y, x1 = +b1.dataset.x, y2 = +b2.dataset.y, x2 = +b2.dataset.x;
    if (y1 !== y2 && x1 !== x2) return null;
    const paso = y1 === y2 ? [0, Math.sign(x2 - x1)] : [Math.sign(y2 - y1), 0];
    const largo = Math.max(Math.abs(y2 - y1), Math.abs(x2 - x1)) + 1;
    const ruta = [];
    for (let k = 0; k < largo; k++) ruta.push(celda(y1 + paso[0]*k, x1 + paso[1]*k));
    return ruta;
  }

  function pintarSeleccion(ruta){
    vista.querySelectorAll('.ce').forEach(c => {
      if (c.dataset.ok) return;
      c.classList.remove('bg-amarillo'); c.classList.add('bg-white');
    });
    (ruta || []).forEach(c => { if (c && !c.dataset.ok){ c.classList.remove('bg-white'); c.classList.add('bg-amarillo'); } });
  }

  function celdaEnPunto(cx, cy){
    const el = document.elementFromPoint(cx, cy);
    return el && el.classList && el.classList.contains('ce') ? el : null;
  }

  function evaluar(b1, b2){
    const ruta = pathEntre(b1, b2);
    let acerto = null;
    if (ruta){
      const texto = ruta.map(c => c.textContent.trim()).join('');
      const cartel = vista.querySelector(`.pd[data-p="${texto}"]`) ||
                     vista.querySelector(`.pd[data-p="${texto.split('').reverse().join('')}"]`);
      if (cartel && !cartel.dataset.ok) acerto = { ruta, cartel };
    }
    if (acerto){
      acerto.ruta.forEach(c => { c.dataset.ok = 1; c.classList.remove('bg-white','bg-amarillo'); c.classList.add('bg-verde','pop'); });
      acerto.cartel.dataset.ok = 1;
      acerto.cartel.classList.add('opacity-40','line-through');
      Sonido.ok(); Voz.hablar(acerto.cartel.textContent.trim()); Puntaje.sumar(2);
      if (++halladas === puestas.length){ Puntaje.sumar(3); UI.festejar('¡LAS ENCONTRASTE TODAS!', jSopa); }
    } else {
      UI.error(b2);
      pintarSeleccion(null);
    }
  }

  grilla.addEventListener('pointerdown', e => {
    const b = e.target.closest('.ce');
    if (!b || b.dataset.ok) return;
    e.preventDefault();
    try { b.releasePointerCapture(e.pointerId); } catch(err){}

    if (pendiente && pendiente !== b){
      // Segunda letra tocada por separado: se evalúa contra la pendiente.
      evaluar(pendiente, b);
      pendiente = null;
      return;
    }
    arrastrando = true; inicio = b; actual = b; pendiente = null;
    pintarSeleccion([b]);
    Sonido.toque();
  });

  grilla.addEventListener('pointermove', e => {
    if (!arrastrando) return;
    e.preventDefault();
    const b = celdaEnPunto(e.clientX, e.clientY);
    if (b && b !== actual && !b.dataset.ok && (b.dataset.y === inicio.dataset.y || b.dataset.x === inicio.dataset.x)){
      actual = b;
      pintarSeleccion(pathEntre(inicio, actual));
    }
  });

  function soltar(){
    if (!arrastrando) return;
    arrastrando = false;
    if (actual === inicio){
      // No hubo arrastre: fue un toque simple. Lo dejamos "pendiente" para
      // que la próxima letra tocada se evalúe contra esta.
      pendiente = inicio;
      return;
    }
    evaluar(inicio, actual);
  }
  grilla.addEventListener('pointerup', soltar);
  grilla.addEventListener('pointercancel', soltar);

  UI.conectarBarra({ siguiente:jSopa, menu:volverAlMenu });
  Voz.hablar('buscá las palabras escondidas');
}

/* ==================================================================
   📚 LECTOESCRITURA 4 · UNÍ CON FLECHAS
   Toca la palabra, después el dibujo, y se dibuja la flecha.
   ================================================================== */
function esPlural(p){
  const t = p.plano;
  if (!t.endsWith('S') || t.length <= 3) return false;
  const sinS  = t.slice(0, -1);
  const sinES = t.slice(0, -2);
  return BANCO.PALABRAS.some(x => x.plano === sinS || x.plano === sinES);
}

function jFlechas(){
  const tres = tomar(BANCO.PALABRAS.filter(p =>
    Img.tiene(p) && !p.texto.includes(' ') && p.cat !== 'nombres' && p.largo <= 9), 3);
  const derecha = mezclar([...tres]);

  vista.innerHTML = `
    <div class="text-center">
      ${UI.consigna('UNÍ CON FLECHAS','TOCÁ LA PALABRA Y DESPUÉS SU DIBUJO')}
      <div class="relative my-5">
        <svg id="lineas" class="absolute inset-0 w-full h-full pointer-events-none" style="z-index:1"></svg>
        <div class="grid grid-cols-2 gap-8 sm:gap-16 relative" style="z-index:2">
          <div class="space-y-3">
            ${tres.map(p => `<button class="lp w-full btn3d bg-amarillo rounded-2xl py-4
              font-titulo font-extrabold text-lg" data-p="${p.plano}">${p.texto}</button>`).join('')}
          </div>
          <div class="space-y-3">
            ${derecha.map(p => `<button class="ld w-full btn3d bg-cielo rounded-2xl py-2
              flex items-center justify-center gap-1" data-p="${p.plano}">
              ${esPlural(p)
                ? dibujo(p,'w-10 h-10') + dibujo(p,'w-10 h-10')
                : dibujo(p,'w-14 h-14')}</button>`).join('')}
          </div>
        </div>
      </div>
      ${UI.barra({ escuchar:false, textoSiguiente:'OTRAS ➡️' })}
    </div>`;

  const svg = vista.querySelector('#lineas');
  let elegida = null, ok = 0;

  function flecha(a, b, color){
    const cont = svg.getBoundingClientRect();
    const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
    const x1 = ra.right - cont.left, y1 = ra.top + ra.height/2 - cont.top;
    const x2 = rb.left  - cont.left, y2 = rb.top + rb.height/2 - cont.top;
    svg.insertAdjacentHTML('beforeend',
      `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}"
         stroke-width="6" stroke-linecap="round"/>
       <circle cx="${x2}" cy="${y2}" r="7" fill="${color}"/>`);
  }

  vista.querySelectorAll('.lp').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.ok) return;
    vista.querySelectorAll('.lp').forEach(x => x.classList.remove('ring-4','ring-verde'));
    elegida = b; b.classList.add('ring-4','ring-verde');
    Sonido.toque(); Voz.hablar(b.textContent.trim());
  }));

  vista.querySelectorAll('.ld').forEach(b => b.addEventListener('click', () => {
    if (!elegida || b.dataset.ok) return;
    if (elegida.dataset.p === b.dataset.p){
      flecha(elegida, b, '#22C55E');
      elegida.dataset.ok = b.dataset.ok = 1;
      elegida.classList.remove('ring-4','ring-verde','bg-amarillo');
      elegida.classList.add('bg-verde');
      b.classList.remove('bg-cielo'); b.classList.add('bg-verde','pop');
      Sonido.ok(); Puntaje.sumar(2);
      elegida = null;
      if (++ok === tres.length){ Puntaje.sumar(2); UI.festejar('¡TODAS UNIDAS!', jFlechas); }
    } else UI.error(b);
  }));

  UI.conectarBarra({ siguiente:jFlechas, menu:volverAlMenu });
  Voz.hablar('uní cada palabra con su dibujo');
}

  vista.querySelectorAll('.opp').forEach(b => b.addEventListener('click', () => {
