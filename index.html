/* ==================================================================
   🧩 LÓGICA 4 · SIMÓN DICE
   ================================================================== */
function jSimon(){
  const BOTONES = [
    { id:0, color:'bg-verde',    nota:523 }, { id:1, color:'bg-rosa',     nota:659 },
    { id:2, color:'bg-cielo',    nota:784 }, { id:3, color:'bg-amarillo', nota:988 }
  ];
  let secuencia = [], turno = 0, mostrando = false;

  vista.innerHTML = `
    <div class="text-center">
      ${UI.consigna('SIMÓN DICE','MIRÁ Y ESCUCHÁ, DESPUÉS REPETÍ EL ORDEN')}
      <p id="ronda" class="font-titulo font-extrabold text-2xl my-3">RONDA 1</p>
      <div class="grid grid-cols-2 gap-3 max-w-xs mx-auto my-4">
        ${BOTONES.map(b => `<button class="sb ${b.color} aspect-square rounded-3xl btn3d
          transition-all duration-150" data-i="${b.id}"></button>`).join('')}
      </div>
      <p id="estado" class="font-titulo font-bold text-tinta/60 min-h-[1.5rem]"></p>
      ${UI.barra({ textoSiguiente:'🔄 EMPEZAR DE NUEVO' })}
    </div>`;

  const dom = [...vista.querySelectorAll('.sb')];
  const estado = vista.querySelector('#estado');
  const ronda  = vista.querySelector('#ronda');

  /* Tamara: con solo "ahora vos" y "muy bien" el juego no se entiende.
     Agregamos una explicación más completa de la mecánica, disponible
     también con el botón 🔊 ESCUCHAR para repetirla cuando quieran. */
  const explicar = () => Voz.hablar('mirá qué botones se iluminan y en qué orden. después, tocá los mismos botones en ese orden');

  // Un solo AudioContext para todo el juego: crear uno nuevo en cada destello
  // (como hacía antes) va acumulando contextos sin cerrar y el navegador
  // termina de "sonidos mudos" después de varias rondas jugadas.
  let ctxSimon = null;
  function audioCtx(){
    if (!ctxSimon) ctxSimon = new (window.AudioContext || window.webkitAudioContext)();
    if (ctxSimon.state === 'suspended') ctxSimon.resume();
    return ctxSimon;
  }
  function destellar(i){
    const b = dom[i];
    b.classList.add('brightness-150','scale-95');
    Sonido.desbloquear();
    // Nota propia de cada botón, dentro de la banda que suena en celular
    const ctx = audioCtx();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = BOTONES[i].nota; o.type = 'sine';
    g.gain.setValueAtTime(0.22, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 0.38);
    setTimeout(() => b.classList.remove('brightness-150','scale-95'), 320);
  }

  async function mostrar(){
    mostrando = true;
    estado.textContent = 'MIRÁ BIEN…';
    if (secuencia.length === 1) explicar();
    await new Promise(r => setTimeout(r, secuencia.length === 1 ? 3600 : 600));
    for (const i of secuencia){
      destellar(i);
      await new Promise(r => setTimeout(r, 520));
    }
    estado.textContent = 'AHORA VOS';
    Voz.hablar('ahora vos');
    mostrando = false;
  }

  function nuevaRonda(){
    secuencia.push((Math.random() * 4) | 0);
    turno = 0;
    ronda.textContent = 'RONDA ' + secuencia.length;
    mostrar();
  }

  dom.forEach(b => b.addEventListener('click', () => {
    if (mostrando) return;
    const i = +b.dataset.i;
    destellar(i);
    if (i === secuencia[turno]){
      turno++;
      if (turno === secuencia.length){
        Puntaje.sumar(secuencia.length);
        estado.textContent = '¡BIEN!';
        if (secuencia.length >= 6){
          Voz.hablar('¡muy bien! llegaste a ' + secuencia.length);
          UI.festejar('¡LLEGASTE A ' + secuencia.length + '!', jSimon);
        } else {
          Sonido.ok();
          Voz.hablar('¡bien!');
          setTimeout(nuevaRonda, 900);
        }
      }
    } else {
      UI.error(b);
      estado.textContent = 'UY… EMPEZAMOS DE NUEVO';
      Voz.hablar('uy, empezamos de nuevo');
      secuencia = [];
      setTimeout(nuevaRonda, 1300);
    }
  }));

  UI.conectarBarra({ escuchar:explicar, siguiente:jSimon, menu:volverAlMenu });
  nuevaRonda();
}

function jNumbers(){
  const n = 1 + ((Math.random() * 100) | 0);

  // sea un desafío real y no tan obvio), si no hay suficientes cerca (n muy
  // chico o muy grande) se completa con cualquier otro del 1 al 100.
  const cercanos = Array.from({ length:100 }, (_, i) => i + 1).filter(x => x !== n && Math.abs(x - n) <= 12);
  const ops = mezclar([n, ...tomar(cercanos, 2)]);

  vista.innerHTML = `
    <div class="text-center">
      ${UI.consigna('NUMBERS 1-100','ESCUCHÁ EL NÚMERO EN INGLÉS Y TOCALO')}

      <div class="flex flex-wrap justify-center gap-4">

  // Dice el número en los dos idiomas, con una pausa entre uno y otro

  // que conoce en español con la palabra nueva en inglés.
  const decirPar = (num, en) => { Voz.hablar(String(num), 'es'); setTimeout(() => Voz.hablar(en, 'en'), 650); };
  const decir = () => decirPar(n, NUMEROS_EN[n-1]);

      UI.festejar(n + ' = ' + NUMEROS_EN[n-1], jNumbers);

  }));
  UI.conectarBarra({ escuchar:decir, siguiente:jNumbers, menu:volverAlMenu });
  setTimeout(decir, 500);
}

/* ==================================================================
   🔢 MATEMÁTICA 3 · RESTAS
   Los que se van quedan tachados: se ve por qué el resultado es ese.

function jRestar(){
  const p = alAzar(BANCO.PALABRAS.filter(x => x.cat === 'comidas' && Img.tiene(x)));
  const a = 3 + ((Math.random() * 7) | 0);          // 3 a 9

/* ==================================================================
   ✏️ CALIGRAFÍA 4 · ESCRIBÍ PALABRAS
   En vez de trazar solo el propio nombre, se practica con palabras
   completas del banco (letra por letra, festejando la palabra entera al
   llegar a la última letra). Si el chico tiene nombre puesto, también
   puede aparecer como una palabra más de la tanda.
   ================================================================== */
function jEscribirPalabras(){
  const nombre = (Perfil.actual() || '').toUpperCase();
  const candidatas = BANCO.PALABRAS.filter(p =>
    !p.plano.includes(' ') && p.cat !== 'nombres' &&
    p.plano.length >= 2 && p.plano.length <= 7 &&
    p.plano.split('').every(c => TRAZOS[c]));

  const opciones = [...candidatas];
  if (nombre && nombre.split('').every(c => TRAZOS[c])) opciones.push({ plano:nombre, texto:nombre });

  const elegida = alAzar(opciones);
  const letras = elegida.plano.split('');
  trazar(letras, 'PALABRAS', elegida.plano);
}

        ${[4,10,18].map((g, i) => `<button data-g="${g}" class="pzg btn3d rounded-full bg-white
          border-2 border-tinta/10 flex items-center justify-center ${i === 1 ? 'ring-4 ring-tinta/40' : ''}"
          style="width:2.6rem;height:2.6rem"><span style="display:inline-block;border-radius:50%;
          background:#334155;width:${g}px;height:${g}px"></span></button>`).join('')}
      </div>
      <div class="flex flex-wrap justify-center gap-3 no-sel">
        <button id="bLimpiar" class="btn3d bg-rosa rounded-3xl px-6 py-4 font-titulo font-extrabold">🧽 LIMPIAR TODO</button>
        <button id="bb-menu" class="btn3d bg-white border-2 border-tinta/10 rounded-3xl px-6 py-4 font-titulo font-bold">🏠 MENÚ</button>
      </div>
    </div>`;

  const cv = vista.querySelector('#pz'), cx = cv.getContext('2d');
  let color = PALETA_PIZARRA[1], grosor = 10, pintando = false, ultimo = null;

  function posDe(e){
    const r = cv.getBoundingClientRect();
    const esc = cv.width / r.width;
    const p = e.touches ? e.touches[0] : e;
    return { x: (p.clientX - r.left) * esc, y: (p.clientY - r.top) * esc };
  }
  function trazarLinea(a, b){
    cx.strokeStyle = color; cx.lineWidth = grosor;
    cx.lineCap = 'round'; cx.lineJoin = 'round';
    cx.beginPath(); cx.moveTo(a.x, a.y); cx.lineTo(b.x, b.y); cx.stroke();
    // Un punto solo (toque sin arrastrar) también deja marca redonda.
    cx.beginPath(); cx.arc(b.x, b.y, grosor/2, 0, Math.PI*2); cx.fillStyle = color; cx.fill();
  }
  const empezar = e => { e.preventDefault(); pintando = true; ultimo = posDe(e); trazarLinea(ultimo, ultimo); };
  const mover   = e => { if (!pintando) return; e.preventDefault(); const p = posDe(e); trazarLinea(ultimo, p); ultimo = p; };
  const soltar  = () => { pintando = false; ultimo = null; };

  cv.addEventListener('mousedown', empezar);
  cv.addEventListener('mousemove', mover);
  if (_mouseupPizarra) removeEventListener('mouseup', _mouseupPizarra);
  _mouseupPizarra = soltar;
  addEventListener('mouseup', _mouseupPizarra);
  cv.addEventListener('touchstart', empezar, { passive:false });
  cv.addEventListener('touchmove', mover, { passive:false });
  cv.addEventListener('touchend', soltar);

  vista.querySelectorAll('.pzc').forEach(b => b.addEventListener('click', () => {
    vista.querySelectorAll('.pzc').forEach(x => x.classList.remove('ring-4','ring-tinta/40'));
    b.classList.add('ring-4','ring-tinta/40');
    color = PALETA_PIZARRA[+b.dataset.i]; Sonido.toque();
  }));
  vista.querySelectorAll('.pzg').forEach(b => b.addEventListener('click', () => {
    vista.querySelectorAll('.pzg').forEach(x => x.classList.remove('ring-4','ring-tinta/40'));
    b.classList.add('ring-4','ring-tinta/40');
    grosor = +b.dataset.g; Sonido.toque();
  }));
  vista.querySelector('#bLimpiar').addEventListener('click', () => {
    cx.clearRect(0, 0, cv.width, cv.height); Sonido.toque();
  });
  vista.querySelector('#bb-menu').addEventListener('click', volverAlMenu);
  Voz.hablar('dibujá lo que quieras');
}

/* ---------- 🫧 REVENTÁ LAS BURBUJAS ---------- */
/* Juego libre/sensorial: burbujas de colores suben con una animación CSS
   (sin loop de JS, para no repetir el bug de listeners que trababa el
   celular) y se revientan al tocarlas. Cada burbuja reventada se
   reemplaza por una nueva, así siempre hay para tocar. */
function jBurbujas(){
  const N_BURBUJAS = 9;
  const coloresOk = COLORES_JUEGO.filter(c => c !== 'NEGRO' && c !== 'GRIS' && c !== 'BLANCO');
  let reventadas = 0;

  function burbujaHTML(i){
    const color = alAzar(coloresOk), hex = COLORES_CSS_LOCAL[color];
    const izq = 4 + Math.random() * 86, tam = 46 + Math.random() * 38;
    const dur = (5 + Math.random() * 5).toFixed(2), retraso = (-Math.random() * 8).toFixed(2);
    return `<button data-i="${i}" data-color="${color}" aria-label="burbuja"
      class="burbuja-sube absolute rounded-full border-2 border-white/70"
      style="left:${izq}%; bottom:-10px; width:${tam}px; height:${tam}px;
      background:radial-gradient(circle at 32% 28%, #fff9, ${hex}); box-shadow:inset 0 0 10px #fff8, 0 2px 6px #0002;
      animation-duration:${dur}s; animation-delay:${retraso}s;"></button>`;
  }

  vista.innerHTML = `
    <div class="text-center">
      ${UI.consigna('REVENTÁ LAS BURBUJAS', 'TOCÁ CADA BURBUJA PARA HACERLA EXPLOTAR')}
      <div id="zonaBurbujas" class="relative mx-auto my-3 rounded-3xl border-4 border-cielo/60
        overflow-hidden max-h-[46vh]" style="height:46vh; max-width:520px;
        background:linear-gradient(#BAE6FD,#E0F2FE)">
        ${Array.from({ length:N_BURBUJAS }, (_, i) => burbujaHTML(i)).join('')}
      </div>
      <p class="font-titulo font-extrabold text-lg"><span id="contBurbujas">REVENTASTE: 0</span></p>
      ${UI.barra({ escuchar:false, textoSiguiente:'🔄 EMPEZAR DE NUEVO' })}
    </div>`;

  const zona = vista.querySelector('#zonaBurbujas');
  const cont = vista.querySelector('#contBurbujas');
  zona.addEventListener('click', e => {
    const b = e.target.closest('[data-i]');
    if (!b) return;
    const i = b.dataset.i, color = b.dataset.color;
    b.replaceWith(document.createRange().createContextualFragment(burbujaHTML(i)));
    reventadas++;
    Sonido.toque(); Puntaje.sumar(1);
    cont.textContent = 'REVENTASTE: ' + reventadas;
    if (reventadas % 4 === 0) Voz.hablar(color);
  });
  UI.conectarBarra({ siguiente:jBurbujas, menu:volverAlMenu });
  Voz.hablar('tocá las burbujas para hacerlas explotar');
}

/* ---------- ⭐ ATRAPÁ LA FORMA ---------- */
/* Mini reflejo motriz: una figura de color aparece en un lugar al azar
   de la zona de juego y hay que tocarla antes de que se desvanezca.
   Usa setTimeout encadenado (como jSimon), nunca setInterval, y una
   bandera "vivo" para no seguir programando rondas si el chico ya se fue
   al menú. */
function jAtraparFormas(){
  const MAX_RONDAS = 14;
  const coloresOk = COLORES_JUEGO.filter(c => c !== 'NEGRO' && c !== 'GRIS' && c !== 'BLANCO');
  let puntos = 0, ronda = 0, activa = false, vivo = true, temporizador = null;

  vista.innerHTML = `
    <div class="text-center">
      ${UI.consigna('ATRAPÁ LA FORMA', 'TOCÁ LA FIGURA ANTES DE QUE SE ESCONDA')}
      <div id="zonaAtrapar" class="relative mx-auto my-3 rounded-3xl border-4 border-amarillo/60
        overflow-hidden max-h-[42vh]" style="height:42vh; max-width:520px; background:#FEF9E7"></div>
      <p class="font-titulo font-extrabold text-lg"><span id="contAtrapar">ATRAPASTE: 0</span></p>
      ${UI.barra({ escuchar:false, textoSiguiente:'🔄 EMPEZAR DE NUEVO' })}
    </div>`;

  const zona = vista.querySelector('#zonaAtrapar');
  const cont = vista.querySelector('#contAtrapar');

  function nuevaForma(){
    if (!vivo) return;
    if (ronda >= MAX_RONDAS){
      zona.innerHTML = '';
      Voz.hablar('¡muy bien! atrapaste ' + puntos + (puntos === 1 ? ' forma' : ' formas'));
      UI.festejar('¡ATRAPASTE ' + puntos + (puntos === 1 ? ' FORMA!' : ' FORMAS!'), jAtraparFormas);
      return;
    }
    ronda++;
    const forma = alAzar(FORMAS), color = alAzar(coloresOk), hex = COLORES_CSS_LOCAL[color];
    const x = 10 + Math.random() * 72, y = 8 + Math.random() * 66;
    zona.innerHTML = `<button data-atrapar class="pop absolute rounded-2xl"
      style="left:${x}%; top:${y}%; width:64px; height:64px; transform:translate(-50%,-50%)">
      <svg viewBox="0 0 100 100" style="fill:${hex}" class="w-full h-full">${forma.svg}</svg></button>`;
    activa = true;
    Sonido.toque();
    clearTimeout(temporizador);
    temporizador = setTimeout(() => {
      if (!vivo) return;
      if (activa){ activa = false; zona.innerHTML = ''; setTimeout(nuevaForma, 300); }
    }, 1500);
  }
  zona.addEventListener('click', e => {
    if (!e.target.closest('[data-atrapar]') || !activa) return;
    activa = false; clearTimeout(temporizador);
    puntos++; cont.textContent = 'ATRAPASTE: ' + puntos;
    Sonido.ok(); Puntaje.sumar(1);
    zona.innerHTML = '';
    setTimeout(nuevaForma, 300);
  });
  UI.conectarBarra({ siguiente:jAtraparFormas, menu:() => { vivo = false; clearTimeout(temporizador); volverAlMenu(); } });
  Voz.hablar('tocá la figura antes de que se escconda');
  nuevaForma();
}

/* Juego libre de creatividad, sin respuesta correcta ni incorrecta:

const CARA_ACCESORIOS = [
  { id:'sombrero', emoji:'🎩', pos:'top:-14px; left:50%; transform:translateX(-50%); font-size:3.2rem' },
  { id:'lentes',   emoji:'🕶️', pos:'top:34%; left:50%; transform:translateX(-50%); font-size:2.6rem' },
  { id:'corbata',  emoji:'🎀', pos:'bottom:-10px; left:50%; transform:translateX(-50%); font-size:2.2rem' },
  { id:'corona',   emoji:'👑', pos:'top:-22px; left:50%; transform:translateX(-50%); font-size:2.8rem' }
];
function jCaraGraciosa(){
  const coloresOk = ['ROJO','AZUL','VERDE','AMARILLO','ROSA','CELESTE','NARANJA','VIOLETA','TURQUESA','FUCSIA'];
  let expIdx = 0, colorIdx = 0, puestos = new Set();

  function pintar(){
    const color = coloresOk[colorIdx], hex = COLORES_CSS_LOCAL[color];
    vista.innerHTML = `
      <div class="text-center">
        ${UI.consigna('ARMÁ UNA CARA GRACIOSA', 'CAMBIÁ LA CARA, LOS ACCESORIOS Y EL COLOR')}

          ${CARA_ACCESORIOS.filter(a => puestos.has(a.id)).map(a =>
            `<span class="absolute pop" style="${a.pos}">${a.emoji}</span>`).join('')}
        </div>

        <div class="flex items-center justify-center gap-4 my-1">
          <button id="caraAnt" class="btn3d bg-white rounded-2xl px-4 py-2 text-xl">⬅️</button>
          <p class="font-titulo font-bold text-tinta/60 text-sm">CARA</p>
          <button id="caraSig" class="btn3d bg-white rounded-2xl px-4 py-2 text-xl">➡️</button>
        </div>

        <p class="font-titulo font-bold text-tinta/50 text-xs mt-2 mb-1">ACCESORIOS</p>
        <div class="flex flex-wrap justify-center gap-1.5">
          ${CARA_ACCESORIOS.map(a => `<button data-acc="${a.id}" class="btn3d rounded-2xl px-2.5 py-1.5 text-xl
            ${puestos.has(a.id) ? 'bg-verde ring-4 ring-verde' : 'bg-white'}">${a.emoji}</button>`).join('')}
        </div>

        <p class="font-titulo font-bold text-tinta/50 text-xs mt-2 mb-1">COLOR</p>
        <div class="flex flex-wrap justify-center gap-1.5">
          ${coloresOk.map((c, i) => `<button data-col="${i}" class="w-8 h-8 rounded-full border-2

        </div>

        <div class="mt-2">
          <button id="caraSorpresa" class="btn3d bg-amarillo rounded-3xl px-5 py-2.5 font-titulo font-extrabold text-sm">🎲 CARA SORPRESA</button>

      </div>`;

    vista.querySelector('#caraAnt').addEventListener('click', () => {
      expIdx = (expIdx - 1 + CARA_EXPRESIONES.length) % CARA_EXPRESIONES.length; Sonido.toque(); pintar();
    });
    vista.querySelector('#caraSig').addEventListener('click', () => {

    vista.querySelectorAll('[data-acc]').forEach(b => b.addEventListener('click', () => {
      const id = b.dataset.acc;
      if (puestos.has(id)) puestos.delete(id); else puestos.add(id);
      Sonido.toque(); pintar();
    }));
    vista.querySelectorAll('[data-col]').forEach(b => b.addEventListener('click', () => {
      colorIdx = +b.dataset.col; Sonido.toque(); pintar();
    }));
    vista.querySelector('#caraSorpresa').addEventListener('click', () => {

    });
    UI.conectarBarra({ siguiente:() => { expIdx = 0; colorIdx = 0; puestos = new Set(); pintar(); }, menu:volverAlMenu });
  }

function jAhorcado(){
  const p = alAzar(BANCO.PALABRAS.filter(x => Img.tiene(x) && !x.texto.includes(' ') &&
    x.cat !== 'nombres' && x.plano.length >= 3 && x.plano.length <= 7));
  const letras = [...new Set(p.plano.split(''))];
  const adivinadas = new Set();
  let globos = 3;

  function pintar(){
    vista.innerHTML = `
      <div class="text-center">
        ${UI.consigna('ADIVINÁ LA PALABRA','TOCÁ LAS LETRAS')}
        <div class="my-3">${UI.escena(dibujo(p,'w-24 h-24 sm:w-28 sm:h-28'),'#FCE7F3')}</div>
        <div class="text-2xl mb-2">${'🎈'.repeat(Math.max(globos,0))}${'💥'.repeat(3-Math.max(globos,0))}</div>
        <div class="font-titulo font-extrabold text-3xl sm:text-4xl tracking-widest my-3">
          ${p.plano.split('').map(l => adivinadas.has(l) ? l : '_').join(' ')}</div>
        <div id="teclAh" class="flex flex-wrap justify-center gap-1 max-w-md mx-auto"></div>
        ${UI.barra({ textoSiguiente:'OTRA ➡️' })}
      </div>`;
    vista.querySelector('#teclAh').innerHTML = LETRAS_DEMO.map(l => `<button data-l="${l}"
      class="btn3d rounded-2xl w-9 h-9 sm:w-10 sm:h-10 font-titulo font-extrabold text-sm
      ${adivinadas.has(l) ? (letras.includes(l) ? 'bg-verde' : 'bg-rosa') + ' pointer-events-none opacity-60' : 'bg-white border-2 border-tinta/10'}">${l}</button>`).join('');
    vista.querySelectorAll('#teclAh [data-l]').forEach(b => b.addEventListener('click', tocarLetra));
    UI.conectarBarra({ escuchar:() => Voz.hablar(p.texto), siguiente:jAhorcado, menu:volverAlMenu });
  }
  function tocarLetra(e){
    const l = e.currentTarget.dataset.l;
    if (adivinadas.has(l)) return;
    adivinadas.add(l);
    if (letras.includes(l)){
      Sonido.ok();
      if (letras.every(x => adivinadas.has(x))){ pintar(); Puntaje.sumar(3); UI.festejar(p.texto, jAhorcado); return; }
    } else {
      globos--; Sonido.error();
      if (globos <= 0){ p.plano.split('').forEach(x => adivinadas.add(x)); pintar(); Voz.hablar('era ' + p.texto); return; }
    }
    pintar();
  }
  pintar();
  Voz.hablar('adiviná la palabra');
}

/* ---------- 🌎 INGLÉS: un mismo juego, distintos temas ---------- */
function jInglesTema(tema){
  const lista = INGLES_TEMAS[tema];
  const info = INGLES_TITULOS[tema];
  const correcta = alAzar(lista);
  /* Se descartan de a uno, chequeando contra TODOS los ya elegidos (no
     solo contra la correcta): si no, dos distractores confundibles entre
     sí (dog/duck) podían terminar juntos aunque ninguno fuera la respuesta. */
  const confunden = (a, b) => (CONFUNDIBLES_EN[a] || []).includes(b) || (CONFUNDIBLES_EN[b] || []).includes(a);
  const elegidos = [correcta];
  for (const c of mezclar(lista.filter(x => x.en !== correcta.en))) {
    if (elegidos.length >= Math.min(3, lista.length)) break;
    if (elegidos.some(e => confunden(e.en, c.en))) continue;
    elegidos.push(c);
  }
  // Si por exceso de confundibles no llegamos a 3 opciones, completamos igual (mejor 2 opciones que trabar el juego).
  if (elegidos.length < Math.min(3, lista.length)) {
    for (const c of lista.filter(x => x.en !== correcta.en && !elegidos.includes(x))) {
      if (elegidos.length >= Math.min(3, lista.length)) break;
      elegidos.push(c);
    }
  }
  const opciones = mezclar(elegidos);
  const esColor = tema === 'colores';
  const esTexto = tema === 'tiempo';

  vista.innerHTML = `
    <div class="text-center">
      ${UI.consigna(info.t, info.d)}
      <button id="bRepT" class="btn3d bg-amarillo rounded-3xl px-8 py-6 my-5
        font-titulo font-extrabold text-2xl sm:text-3xl">🔊 ${correcta.en}</button>
      <div class="grid grid-cols-3 gap-3 max-w-lg mx-auto">
        ${opciones.map(o => {
          const p = BANCO.buscar(o.es);
          return `<button class="opit ${esTexto?'':'aspect-square'} rounded-3xl bg-cielo btn3d flex items-center
            justify-center p-3 ${esTexto?'font-titulo font-extrabold text-lg':''}" data-ok="${o.en===correcta.en}" data-en="${o.en}">
            ${esTexto ? o.es : (esColor ? Img.html(p,'w-full h-full',{comoColor:true}) : dibujo(p,'w-full h-full'))}</button>`;
        }).join('')}
      </div>
      ${UI.barra({ textoSiguiente:'NEXT ➡️' })}
    </div>`;

  const decir = () => Voz.hablar(correcta.en, 'en');

/* Suma Constructora (rediseñado a pedido de Tamara): ahora es "¿cuántos
   ladrillos necesito para la casa?". La casa se dibuja siempre igual,
   estilo Lego, en modo silueta/sombra (gris, como el tangram): 2 columnas
   de 4 ladrillos, y un techo de 4 (dos arriba de cada columna + dos en
   el medio) más 3 encima haciendo el pico. Cada ronda pregunta por una
   parte distinta —una columna, las dos juntas, el techo, o la casa
   entera— y al contestar bien esa parte se "construye" (se colorea) en
   la silueta, como un rompecabezas de sombras. */
const CASA_LADRILLOS = (() => {
  const ladrillos = [];
  // pico: 3 ladrillos, centrados arriba del techo
  [20,40,60].forEach(x => ladrillos.push({ x, y:2,  w:18, h:13, grupo:'pico' }));
  // techo: 4 ladrillos (2 sobre cada columna + 2 en el medio), en fila
  [8,28,48,68].forEach(x => ladrillos.push({ x, y:17, w:18, h:13, grupo:'techo' }));
  // columna A (izquierda) y columna B (derecha): 4 ladrillos cada una
  [32,47,62,77].forEach(y => {
    ladrillos.push({ x:8,  y, w:18, h:13, grupo:'colA' });
    ladrillos.push({ x:68, y, w:18, h:13, grupo:'colB' });
  });
  return ladrillos;
})();
const CASA_PREGUNTAS = [
  { grupos:['colA'],               texto:'¿CUÁNTOS LADRILLOS TIENE UNA COLUMNA?' },
  { grupos:['colA','colB'],        texto:'LAS DOS COLUMNAS JUNTAS, ¿CUÁNTOS LADRILLOS SON?' },
  { grupos:['techo','pico'],       texto:'¿CUÁNTOS LADRILLOS TIENE TODO EL TECHO?' },
  { grupos:['colA','colB','techo','pico'], texto:'EN TOTAL, ¿CUÁNTOS LADRILLOS NECESITÁS PARA TODA LA CASA?' }
];
function jSumaConstructora(){
  const pregunta = alAzar(CASA_PREGUNTAS);
  const total = CASA_LADRILLOS.filter(l => pregunta.grupos.includes(l.grupo)).length;
  const opciones = mezclar([total, ...tomar([...Array(16).keys()].map(x=>x+1).filter(x => x !== total), 2)]);
  vista.innerHTML = `
    <div class="text-center">
      ${UI.consigna('SUMA CONSTRUCTORA: LA CASA','¿CUÁNTOS LADRILLOS NECESITO PARA LA CASA?')}
      <svg viewBox="0 0 96 92" class="w-40 h-40 sm:w-48 sm:h-48 mx-auto my-2">
        ${CASA_LADRILLOS.map((l,i) => `<rect id="lad${i}" x="${l.x}" y="${l.y}" width="${l.w}" height="${l.h}" rx="2"
          fill="${pregunta.grupos.includes(l.grupo) ? '#CBD5E1' : '#E2E8F0'}"
          stroke="#94A3B8" stroke-width="1" data-grupo="${l.grupo}"/>`).join('')}
      </svg>
      <p class="font-titulo font-extrabold text-lg sm:text-xl my-2 px-2">${pregunta.texto}</p>
      <div class="flex flex-wrap justify-center gap-3">
        ${opciones.map(o => `<button class="osc btn3d bg-amarillo rounded-3xl w-16 h-16
          font-titulo font-extrabold text-2xl" data-ok="${o===total}">${o}</button>`).join('')}
      </div>
      ${UI.barra({ textoSiguiente:'OTRA CASA ➡️' })}
    </div>`;
  const decir = () => Voz.hablar(pregunta.texto.toLowerCase());
  vista.querySelectorAll('.osc').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.ok === 'true'){
      b.classList.add('pop','bg-verde'); Sonido.ok(); Puntaje.sumar(3);
      // "Construye" la parte de la casa que se acertó: la colorea de ladrillo.
      CASA_LADRILLOS.forEach((l, i) => {
        if (pregunta.grupos.includes(l.grupo)) vista.querySelector('#lad' + i).setAttribute('fill', '#FB923C');
      });
      UI.festejar('SON ' + total, jSumaConstructora);
    } else UI.error(b);
  }));
  UI.conectarBarra({ escuchar:decir, siguiente:jSumaConstructora, menu:volverAlMenu });
  decir();
}

/* Tangram (rediseñado a pedido de Tamara): antes había que TOCAR las
   formas en un orden escondido, que se sentía raro porque el chico no
   elegía dónde iba cada pieza. Ahora es un verdadero rompecabezas de
   sombras: cada hueco gris (la sombra) es una zona donde soltar, y hay
   una pieza de color por cada hueco (arrastrable) — el chico decide a
   qué sombra la lleva, y si la forma coincide, se queda ahí puesta. */
function jTangram(){
  const fig = alAzar(FIGURAS_TANGRAM);
  let armadas = 0;
  const piezasMezcladas = mezclar(fig.piezas.map((pz, k) => ({ ...pz, k })));
  vista.innerHTML = `
    <div class="text-center">
      ${UI.consigna('TANGRAM: ' + fig.nombre, 'ARRASTRÁ CADA PIEZA A SU SOMBRA')}
      <div class="relative w-56 h-56 sm:w-64 sm:h-64 mx-auto my-3 bg-crema rounded-3xl border-4 border-cielo/50">
        ${fig.piezas.map((pz, k) => `<div id="pz${k}" data-zone-tg="1" data-f="${pz.f}"
          class="absolute" style="left:${pz.x}%;top:${pz.y}%;width:${pz.s}%;height:${pz.s}%">
          <svg viewBox="0 0 100 100" class="w-full h-full" fill="#CBD5E1">${FORMAS.find(x=>x.id===pz.f).svg}</svg>
        </div>`).join('')}
      </div>
      <div class="flex flex-wrap justify-center gap-3">
        ${piezasMezcladas.map(pz => `<button id="tgp${pz.k}" data-f="${pz.f}"
          class="tgpieza btn3d bg-white border-4 border-naranja rounded-2xl p-2 w-14 h-14 sm:w-16 sm:h-16">
          <svg viewBox="0 0 100 100" fill="#FB923C">${FORMAS.find(x=>x.id===pz.f).svg}</svg></button>`).join('')}
      </div>
      ${UI.barra({ escuchar:false, textoSiguiente:'OTRA FIGURA ➡️' })}
    </div>`;
  vista.querySelectorAll('[data-zone-tg]').forEach(z => Drag.zona(z));
  vista.querySelectorAll('.tgpieza').forEach(p => Drag.ficha(p));
  Drag.alSoltar((zona, pieza) => {
    if (!zona.hasAttribute('data-zone-tg') || zona.dataset.ok) return;
    if (zona.dataset.f === pieza.dataset.f){
      zona.dataset.ok = '1';
      zona.querySelector('svg').setAttribute('fill', '#FB923C');
      pieza.remove();
      Sonido.ok(); Puntaje.sumar(1); armadas++;
      if (armadas === fig.piezas.length){ Puntaje.sumar(2); UI.festejar('¡ARMASTE ' + fig.nombre + '!', jTangram); }
    } else UI.error(zona);
  });
  UI.conectarBarra({ siguiente:jTangram, menu:volverAlMenu });
  Voz.hablar('arrastrá cada pieza a la sombra que tiene su misma forma para armar ' + fig.nombre);
}

function jMayorMenorIgual(){

/* ---------- ✏️ CALIGRAFÍA: dibujo libre con guía de fondo ---------- */
let _mouseupDibujoAsistido = null;
function jDibujoAsistido(){
  const dib = alAzar(DIBUJOS_PINTAR);
  vista.innerHTML = `
    <div class="text-center">
      ${UI.consigna('DIBUJO LIBRE ASISTIDO','SEGUÍ LAS LÍNEAS COMO GUÍA Y DIBUJÁ ENCIMA')}
      <div class="relative bg-white rounded-3xl border-4 border-lila/60 p-2 my-3 mx-auto" style="width:300px">
        <svg viewBox="0 0 300 230" class="absolute inset-2 pointer-events-none" style="opacity:.25">
          <g fill="none" stroke="#334155" stroke-width="4">${dib.lineas}</g>
        </svg>
        <canvas id="pzA" width="300" height="230" class="w-full touch-none rounded-2xl relative"></canvas>
      </div>
      <div class="flex flex-wrap justify-center gap-2 mb-3">
        ${PALETA_PIZARRA.map((c, i) => `<button class="pzca btn3d rounded-full w-10 h-10 sm:w-12 sm:h-12
          ${i === 1 ? 'ring-4 ring-tinta/40' : ''}" data-i="${i}"
          style="background:${c};border:3px solid rgba(0,0,0,.18)"></button>`).join('')}
      </div>
      <div class="flex flex-wrap justify-center gap-3 no-sel">
        <button id="bLimpiarA" class="btn3d bg-rosa rounded-3xl px-6 py-4 font-titulo font-extrabold">🧽 LIMPIAR</button>
        <button id="bOtroDibA" class="btn3d bg-cielo rounded-3xl px-6 py-4 font-titulo font-extrabold">🖼️ OTRO DIBUJO</button>
        <button id="bb-menu" class="btn3d bg-white border-2 border-tinta/10 rounded-3xl px-6 py-4 font-titulo font-bold">🏠 MENÚ</button>
      </div>
    </div>`;

  const cv = vista.querySelector('#pzA'), cx = cv.getContext('2d');
  let color = PALETA_PIZARRA[1], grosor = 8, pintando = false, ultimo = null;
  function posDe(e){
    const r = cv.getBoundingClientRect(); const esc = cv.width / r.width;
    const p = e.touches ? e.touches[0] : e;
    return { x:(p.clientX-r.left)*esc, y:(p.clientY-r.top)*esc };
  }
  function trazarLinea(a,b){
    cx.strokeStyle = color; cx.lineWidth = grosor; cx.lineCap='round'; cx.lineJoin='round';
    cx.beginPath(); cx.moveTo(a.x,a.y); cx.lineTo(b.x,b.y); cx.stroke();
    cx.beginPath(); cx.arc(b.x,b.y,grosor/2,0,Math.PI*2); cx.fillStyle=color; cx.fill();
  }
  const empezar = e => { e.preventDefault(); pintando=true; ultimo=posDe(e); trazarLinea(ultimo,ultimo); };
  const mover   = e => { if (!pintando) return; e.preventDefault(); const p=posDe(e); trazarLinea(ultimo,p); ultimo=p; };
  const soltar  = () => { pintando=false; ultimo=null; };
  cv.addEventListener('mousedown', empezar); cv.addEventListener('mousemove', mover);
  if (_mouseupDibujoAsistido) removeEventListener('mouseup', _mouseupDibujoAsistido);
  _mouseupDibujoAsistido = soltar;
  addEventListener('mouseup', _mouseupDibujoAsistido);
  cv.addEventListener('touchstart', empezar, {passive:false}); cv.addEventListener('touchmove', mover, {passive:false});
  cv.addEventListener('touchend', soltar);
  vista.querySelectorAll('.pzca').forEach(b => b.addEventListener('click', () => {
    vista.querySelectorAll('.pzca').forEach(x => x.classList.remove('ring-4','ring-tinta/40'));
    b.classList.add('ring-4','ring-tinta/40'); color = PALETA_PIZARRA[+b.dataset.i]; Sonido.toque();
  }));
  vista.querySelector('#bLimpiarA').addEventListener('click', () => { cx.clearRect(0,0,cv.width,cv.height); Sonido.toque(); });
  vista.querySelector('#bOtroDibA').addEventListener('click', jDibujoAsistido);
  vista.querySelector('#bb-menu').addEventListener('click', volverAlMenu);
  Voz.hablar('seguí las líneas como guía y dibujá encima');
}

      if (modo === 'simon' && cancionSel){
        secuenciaChico.push(i);
        const k = secuenciaChico.length - 1;
        if (cancionSel.notas[k] !== i){
          UI.error(b); secuenciaChico = [];
          const prog = vista.querySelector('#progSimon'); if (prog) prog.textContent = '0';
          return;
        }
        const prog = vista.querySelector('#progSimon'); if (prog) prog.textContent = secuenciaChico.length;
        if (secuenciaChico.length === cancionSel.notas.length){
          Puntaje.sumar(5);
          UI.festejar('¡TOCASTE ' + cancionSel.nombre + '!', () => { secuenciaChico = []; pintar(); });
        }
      }
    }));
    vista.querySelector('#bb-menu').addEventListener('click', volverAlMenu);
  }

  function reproducirCancion(c){
    reproduciendo = true;
    c.notas.forEach((i, k) => {
      setTimeout(() => {
        const tecla = vista.querySelectorAll('.tecla')[i];
        Sonido.nota(NOTAS_XILOFONO[i].freq);
        if (tecla){ tecla.classList.add('pop'); setTimeout(() => tecla.classList.remove('pop'), 200); }
        if (k === c.notas.length - 1) setTimeout(() => { reproduciendo = false; }, 350);
      }, k * 450);
    });
  }

  pintar();
  Voz.hablar('tocá las teclas del xilófono');
}
