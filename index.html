/** Palabras con dibujo y de largo razonable, listas para jugar */
function palabrasJugables({ cat = null, minSil = 0, maxSil = 9, conDibujo = true } = {}){
  return BANCO.filtrar({ cat, conDibujo: conDibujo ? null : null })
    .filter(p => (conDibujo ? (p.twemoji || true) : true))
    .filter(p => !p.esColor && p.cat !== 'nombres' && !p.texto.includes(' '))
    .filter(p => { const n = Silabas.separar(p.texto).length; return n >= minSil && n <= maxSil; });
}

function pantallaPerfil(){
  const nombres = BANCO.nombres();
  const d = document.createElement('div');
  d.id = 'bb-perfil-pantalla';
  d.className = 'fixed inset-0 z-[9999] bg-gradient-to-b from-cielo via-crema to-rosa overflow-y-auto p-4 no-sel';
  d.innerHTML = `
    <div class="max-w-3xl mx-auto text-center py-4">
      <div class="text-6xl sm:text-7xl flota">🎒</div>
      <h1 class="font-titulo font-extrabold text-3xl sm:text-5xl mt-2">BUSY BOOK</h1>
      <p class="font-titulo font-bold text-lg sm:text-2xl text-tinta/70 mb-4">¿QUIÉN VA A JUGAR?</p>

      <input id="bb-buscar" placeholder="BUSCÁ TU NOMBRE"
        class="w-full max-w-sm rounded-3xl border-4 border-white p-4 font-titulo font-extrabold text-xl text-center shadow">

      <div id="bb-nombres" class="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-4"></div>

      <button id="bb-invitado" class="btn3d bg-white rounded-3xl px-8 py-4 mt-5 font-titulo font-extrabold text-lg">
        🧒 JUGAR SIN NOMBRE
      </button>
    </div>`;
  document.body.appendChild(d);

  const cont = d.querySelector('#bb-nombres');
  function pintar(filtro = ''){
    const f = BANCO.sinAcento(filtro.toUpperCase());
    const lista = nombres.filter(n => !f || n.plano.includes(f)).slice(0, 40);
    cont.innerHTML = lista.length
      ? lista.map(n => `<button data-n="${n.texto}"
          class="btn3d bg-white rounded-2xl px-2 py-3 font-titulo font-extrabold text-sm sm:text-base">
          <span class="text-2xl block">${Perfil.emojiDe(n.texto)}</span>${n.texto}</button>`).join('')
      : `<p class="col-span-full font-titulo font-bold text-tinta/50 py-4">
           NO ESTÁ ESE NOMBRE. TOCÁ "JUGAR SIN NOMBRE".</p>`;
    cont.querySelectorAll('[data-n]').forEach(b => b.addEventListener('click', () => entrar(b.dataset.n)));
  }
  pintar();
  d.querySelector('#bb-buscar').addEventListener('input', e => pintar(e.target.value));
  d.querySelector('#bb-invitado').addEventListener('click', () => entrar(null));

  function entrar(nombre){
    Sonido.desbloquear(); Voz.precalentar();
    if (nombre) Perfil.poner(nombre); else Perfil.salir();
    d.remove();
    arrancar();
    setTimeout(() => Voz.hablar(nombre ? 'hola ' + nombre + ', vamos a jugar' : 'vamos a jugar'), 300);
  }
}

  }));
  vista.querySelector('#bb-volver-panel').addEventListener('click', panelInicio);
}

/* ==================================================================
   📚 LECTOESCRITURA 1 · ARMÁ LA PALABRA (SÍLABAS)
   ================================================================== */
function jArmarSilabas(){
  const candidatas = BANCO.PALABRAS.filter(p =>
    p.twemoji && !p.texto.includes(' ') && p.cat !== 'nombres');
  const p = alAzar(candidatas);
  const sil = Silabas.separar(p.texto);
  const sobra = tomar(['PA','TO','LE','MI','SU','RO','NA','TE','LU','SI'].filter(s => !sil.includes(s)), 2);

  vista.innerHTML = `
    <div class="text-center">
      ${UI.consigna('ARMÁ LA PALABRA','ARRASTRÁ LAS SÍLABAS A SU LUGAR')}
      <div class="my-3">${UI.escena(dibujo(p, 'w-24 h-24'))}</div>
      <div class="flex flex-wrap justify-center gap-2 my-4">
        ${sil.map((_, i) => `<div class="zz w-20 h-20 sm:w-24 sm:h-24 rounded-3xl bg-cielo/25
          border-4 border-dashed border-cielo flex items-center justify-center
          font-titulo font-extrabold text-2xl transition-transform" data-i="${i}"></div>`).join('')}
      </div>
      <div class="bg-crema rounded-3xl p-3 border-4 border-amarillo/60">
        <p class="font-titulo font-bold text-tinta/60 text-sm mb-2">BANCO DE SÍLABAS</p>
        <div class="flex flex-wrap justify-center gap-2">
          ${mezclar([...sil, ...sobra]).map(s => `<div class="ff btn3d bg-amarillo rounded-3xl px-4 py-3
            min-w-[4.5rem] font-titulo font-extrabold text-2xl" data-val="${s}">${s}</div>`).join('')}
        </div>
      </div>
      ${UI.barra({ textoSiguiente:'OTRA PALABRA ➡️' })}
    </div>`;

  let ok = 0;
  vista.querySelectorAll('.zz').forEach(z => Drag.zona(z));
  vista.querySelectorAll('.ff').forEach(f => { Drag.ficha(f);
    f.addEventListener('click', () => Voz.hablar(f.dataset.val)); });

  Drag.alSoltar((z, f) => {
    if (!z.matches('.zz') || z.dataset.ok) return;
    if (f.dataset.val === sil[+z.dataset.i]){
      z.textContent = f.dataset.val; z.dataset.ok = 1;
      z.classList.remove('bg-cielo/25','border-dashed');
      z.classList.add('bg-verde','border-solid','pop');
      f.classList.add('invisible','pointer-events-none');
      Sonido.ok(); Voz.hablar(f.dataset.val); Puntaje.sumar(1);
      if (++ok === sil.length){ Puntaje.sumar(2);
        setTimeout(() => Voz.hablar(p.texto), 500);
        UI.festejar(p.texto, jArmarSilabas); }
    } else UI.error(z);
  });

  UI.conectarBarra({ escuchar:() => Voz.hablar(p.texto), siguiente:jArmarSilabas, menu:volverAlMenu });
  Voz.hablar(p.texto);
}

      armada = armada.slice(0, -1); actualizar();
    });
    vista.querySelector('#bLimpiar').addEventListener('click', () => { armada = ''; actualizar(); });
    vista.querySelector('#bProbar').addEventListener('click', probar);
    UI.conectarBarra({ siguiente:() => { armada = ''; pintar(); }, menu:volverAlMenu });
  }

  function actualizar(){
    const pz = vista.querySelector('#pizarra');
    pz.innerHTML = armada || '<span class="text-tinta/25">…</span>';
    vista.querySelector('#aviso').textContent = '';
  }

  function probar(){
    if (armada.length < 2) return;
    const p = BANCO.buscar(armada);
    const aviso = vista.querySelector('#aviso');
    if (p && !encontradas.includes(p.texto)){
      encontradas.push(p.texto);
      localStorage.setItem('bb_encontradas', JSON.stringify(encontradas));
      Puntaje.sumar(3);
      Voz.hablar(p.texto);
      UI.festejar(`${p.texto}<div class="mt-2">${dibujo(p, 'w-20 h-20')}</div>`, () => { armada = ''; pintar(); });
    } else if (p){
      aviso.innerHTML = '<span class="text-cielo">✅ ' + p.texto + ' — YA LA HABÍAS ENCONTRADO</span>';
      Sonido.ok(); Voz.hablar(p.texto);
    } else {
      aviso.innerHTML = '<span class="text-tinta/50">ESA PALABRA NO EXISTE. ¡SEGUÍ PROBANDO!</span>';
      UI.error(vista.querySelector('#pizarra'));
    }
  }
  pintar();
  Voz.hablar('armá una palabra con las sílabas');
}

/* ==================================================================
   🧩 LÓGICA 1 · ROMPECABEZAS (usa las escenas hechas con IA)
   ================================================================== */
function jPuzzle(){
  const esc = alAzar(ESCENAS);
  const F = 2, C = 3;                       // 2 filas × 3 columnas = 6 piezas
  const piezas = [];
  for (let f = 0; f < F; f++) for (let c = 0; c < C; c++) piezas.push({ f, c, i:f*C + c });

  const estilo = pz => `background-image:url('img/propias/${esc.archivo}');
    background-size:${C * 100}% ${F * 100}%;
    background-position:${(pz.c / (C-1)) * 100}% ${(pz.f / (F-1)) * 100}%;`;

  vista.innerHTML = `
    <div class="text-center">
      ${UI.consigna('ARMÁ EL ROMPECABEZAS', esc.nombre + ' · ARRASTRÁ CADA PIEZA A SU LUGAR')}
      <div class="mx-auto my-4 grid gap-1 bg-cielo/20 p-2 rounded-3xl border-4 border-dashed border-cielo"
           style="grid-template-columns:repeat(${C},1fr);max-width:26rem">
        ${piezas.map(pz => `<div class="zp aspect-[4/3] rounded-xl bg-white/60 transition-transform"
          data-i="${pz.i}"></div>`).join('')}
      </div>
      <div class="bg-crema rounded-3xl p-2 border-4 border-amarillo/60">
        <p class="font-titulo font-bold text-tinta/60 text-sm mb-2">LAS PIEZAS</p>
        <div class="flex flex-wrap justify-center gap-1.5">
          ${mezclar([...piezas]).map(pz => `<div class="fp btn3d rounded-xl bg-cover"
            data-val="${pz.i}" style="${estilo(pz)}width:5.5rem;height:4.125rem"></div>`).join('')}
        </div>
      </div>
      ${UI.barra({ escuchar:false, textoSiguiente:'OTRO DIBUJO ➡️' })}
    </div>`;

  let ok = 0;
  vista.querySelectorAll('.zp').forEach(z => Drag.zona(z));
  vista.querySelectorAll('.fp').forEach(f => Drag.ficha(f));

  Drag.alSoltar((z, f) => {
    if (!z.matches('.zp') || z.dataset.ok) return;
    if (z.dataset.i === f.dataset.val){
      // Copiamos SOLO lo del fondo, no el ancho ni el alto de la ficha:
      // la zona tiene que conservar su tamaño dentro de la grilla.
      const pz = piezas[+z.dataset.i];
      z.style.backgroundImage    = `url('img/propias/${esc.archivo}')`;
      z.style.backgroundSize     = `${C * 100}% ${F * 100}%`;
      z.style.backgroundPosition = `${(pz.c / (C-1)) * 100}% ${(pz.f / (F-1)) * 100}%`;
      z.classList.add('pop'); z.classList.remove('bg-white/60');
      z.dataset.ok = 1;
      f.classList.add('invisible','pointer-events-none');
      Sonido.ok(); Puntaje.sumar(1);
      if (++ok === piezas.length){ Puntaje.sumar(3);
        Voz.hablar('armaste ' + esc.nombre);
        UI.festejar(esc.nombre, jPuzzle); }
    } else UI.error(z);
  });
  UI.conectarBarra({ siguiente:jPuzzle, menu:volverAlMenu });
  Voz.hablar('armá el rompecabezas de ' + esc.nombre);
}

/* ==================================================================
   🧩 LÓGICA 2 · MEMORIA PALABRA ↔ DIBUJO
   ================================================================== */
function jMemo(){
  const elegidas = tomar(BANCO.PALABRAS.filter(p =>
    p.twemoji && !p.texto.includes(' ') && p.cat !== 'nombres' && p.largo <= 8), 4);

  const cartas = mezclar(elegidas.flatMap(p => [
    { par:p.plano, tipo:'img', p }, { par:p.plano, tipo:'txt', p }
  ]));

  vista.innerHTML = `
    <div class="text-center">
      ${UI.consigna('JUEGO DE MEMORIA','UNÍ CADA PALABRA CON SU DIBUJO')}
      <div class="grid grid-cols-4 gap-2 max-w-lg mx-auto my-5">
        ${cartas.map((c, i) => `<button class="cm aspect-square rounded-3xl bg-rosa btn3d
          flex items-center justify-center p-1" data-i="${i}" data-par="${c.par}">
          <span class="cara text-3xl sm:text-4xl">❓</span></button>`).join('')}
      </div>
      ${UI.barra({ escuchar:false, textoSiguiente:'🔄 DE NUEVO' })}
    </div>`;

  const dom = [...vista.querySelectorAll('.cm')];
  let abiertas = [], bloqueado = false, pares = 0;

  dom.forEach((b, i) => b.addEventListener('click', () => {
    if (bloqueado || b.dataset.ok || abiertas.includes(b)) return;
    const c = cartas[i];
    const cara = b.querySelector('.cara');
    cara.innerHTML = c.tipo === 'img'
      ? dibujo(c.p, 'w-10 h-10 sm:w-12 sm:h-12')
      : `<span class="font-titulo font-extrabold text-[10px] sm:text-sm leading-tight">${c.p.texto}</span>`;
    b.classList.add('pop');
    Voz.hablar(c.p.texto);
    abiertas.push(b);

    if (abiertas.length === 2){
      const [x, y] = abiertas;
      if (x.dataset.par === y.dataset.par){
        x.dataset.ok = y.dataset.ok = 1;
        [x, y].forEach(e => { e.classList.remove('bg-rosa'); e.classList.add('bg-verde'); });
        Sonido.ok(); Puntaje.sumar(2); abiertas = [];
        if (++pares === elegidas.length){ Puntaje.sumar(2); UI.festejar('¡TODAS LAS PAREJAS!', jMemo); }
      } else {
        bloqueado = true; Sonido.error();
        [x, y].forEach(e => e.classList.add('shake'));
        setTimeout(() => {
          [x, y].forEach(e => { e.classList.remove('shake'); e.querySelector('.cara').innerHTML = '❓'; });
          abiertas = []; bloqueado = false;
        }, 900);
      }
    }
  }));
  UI.conectarBarra({ siguiente:jMemo, menu:volverAlMenu });
}

      </div>
      <div class="grid grid-cols-4 gap-2 max-w-xl mx-auto">
        ${cuatro.map(f => `<div class="zq rounded-3xl bg-tinta/5 border-4 border-dashed border-tinta/20
          p-2 transition-transform" data-val="${f.id}">
          ${svg(f, '#E2E8F0', 'w-full h-16')}
          <div class="font-titulo font-extrabold text-[10px] sm:text-xs mt-1">${f.nombre}</div>
        </div>`).join('')}
      </div>
      ${UI.barra({ escuchar:false, textoSiguiente:'OTRAS ➡️' })}
    </div>`;

  let ok = 0;
  vista.querySelectorAll('.zq').forEach(z => Drag.zona(z));
  vista.querySelectorAll('.fq').forEach(f => { Drag.ficha(f);
    f.addEventListener('click', () => Voz.hablar(FORMAS.find(x => x.id === f.dataset.val).nombre)); });

  Drag.alSoltar((z, f) => {
    if (!z.matches('.zq') || z.dataset.ok) return;
    if (z.dataset.val === f.dataset.val){
      z.querySelector('svg').setAttribute('fill', '#86EFAC');
      z.dataset.ok = 1;
      z.classList.remove('bg-tinta/5','border-dashed');
      z.classList.add('bg-verde/40','border-solid','pop');
      f.classList.add('invisible','pointer-events-none');
      Sonido.ok(); Voz.hablar(FORMAS.find(x => x.id === f.dataset.val).nombre); Puntaje.sumar(1);
      if (++ok === cuatro.length){ Puntaje.sumar(2); UI.festejar('¡TODAS ENCASTRADAS!', jFormas); }
    } else UI.error(z);
  });
  UI.conectarBarra({ siguiente:jFormas, menu:volverAlMenu });
  Voz.hablar('cada forma en su hueco');
}

/* ==================================================================
   ✏️ CALIGRAFÍA · TRAZAR (letras y números comparten el motor)
   ================================================================== */
function trazar(set, titulo){
  let i = 0;

  function pintar(){
    const ch = set[i];
    const guia = TRAZOS[ch] || [];

    vista.innerHTML = `
      <div class="text-center">
        ${UI.consigna('TRAZÁ LA ' + (titulo === 'LETRAS' ? 'LETRA ' : '') + ch,
                      'SEGUÍ LOS PUNTITOS CON EL DEDO · LOS NUMERITOS DICEN EL ORDEN')}
        <div class="flex justify-center my-4">
          <canvas id="cv" width="220" height="220" class="trazo bg-crema rounded-3xl
            border-4 border-cielo shadow-inner touch-none"></canvas>
        </div>
        <div class="flex flex-wrap justify-center gap-2 mb-3">
          ${set.map((c, k) => `<button data-k="${k}" class="btn3d rounded-2xl w-11 h-11
            font-titulo font-extrabold ${k === i ? 'bg-cielo' : 'bg-white border-2 border-tinta/10'}">${c}</button>`).join('')}
        </div>
        <div class="flex flex-wrap justify-center gap-3 no-sel">
          <button id="bBorr" class="btn3d bg-rosa rounded-3xl px-5 py-4 font-titulo font-extrabold">🧽 BORRAR</button>
          <button id="bb-escuchar" class="btn3d bg-amarillo rounded-3xl px-5 py-4 font-titulo font-extrabold">🔊 ESCUCHAR</button>
          <button id="bb-siguiente" class="btn3d bg-verde rounded-3xl px-5 py-4 font-titulo font-extrabold">SIGUIENTE ➡️</button>
          <button id="bb-menu" class="btn3d bg-white border-2 border-tinta/10 rounded-3xl px-5 py-4 font-titulo font-bold">🏠 MENÚ</button>
        </div>
      </div>`;

    const cv = vista.querySelector('#cv'), cx = cv.getContext('2d');
    let pintando = false, recorrido = 0, ultimo = null, hecho = false;
    // Cuánto hay que trazar: el largo real de la guía, con margen para no frustrar
    const largoGuia = guia.reduce((s, [a, b]) => s + Math.hypot(b[0]-a[0], b[1]-a[1]), 0);
    const meta = Math.max(120, largoGuia * 0.62);

    function dibujarGuia(){
      cx.clearRect(0, 0, 220, 220);
      cx.setLineDash([7, 9]); cx.lineWidth = 13; cx.strokeStyle = '#CBD5E1'; cx.lineCap = 'round';
      guia.forEach(([a, b]) => { cx.beginPath(); cx.moveTo(a[0], a[1]); cx.lineTo(b[0], b[1]); cx.stroke(); });
      cx.setLineDash([]);
      guia.forEach(([a], k) => {
        cx.fillStyle = '#7DD3FC'; cx.beginPath(); cx.arc(a[0], a[1], 11, 0, 7); cx.fill();
        cx.fillStyle = '#fff'; cx.font = 'bold 14px Nunito, sans-serif';
        cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText(k + 1, a[0], a[1] + 1);
      });
    }
    dibujarGuia();

    const punto = e => {
      const r = cv.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return { x:(t.clientX - r.left) * 220 / r.width, y:(t.clientY - r.top) * 220 / r.height };
    };
    const arrancar = e => { e.preventDefault(); pintando = true; ultimo = punto(e); };
    const mover = e => {
      if (!pintando) return; e.preventDefault();
      const q = punto(e);
      cx.strokeStyle = '#F472B6'; cx.lineWidth = 11; cx.lineCap = cx.lineJoin = 'round';
      cx.beginPath(); cx.moveTo(ultimo.x, ultimo.y); cx.lineTo(q.x, q.y); cx.stroke();
      recorrido += Math.hypot(q.x - ultimo.x, q.y - ultimo.y);
      ultimo = q;
      if (!hecho && recorrido > meta){
        hecho = true; Puntaje.sumar(2);
        setTimeout(() => Voz.hablar(titulo === 'LETRAS' ? 'la letra ' + ch : 'el ' + ch), 300);
        UI.festejar((titulo === 'LETRAS' ? 'LETRA ' : '') + ch, siguiente);
      }
    };
    const soltar = () => { pintando = false; };

    cv.addEventListener('mousedown', arrancar);
    cv.addEventListener('mousemove', mover);
    addEventListener('mouseup', soltar);
    cv.addEventListener('touchstart', arrancar, { passive:false });
    cv.addEventListener('touchmove', mover, { passive:false });
    cv.addEventListener('touchend', soltar);

    vista.querySelector('#bBorr').addEventListener('click', () => {
      recorrido = 0; hecho = false; dibujarGuia();
    });
    vista.querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', () => {
      i = +b.dataset.k; pintar();
    }));
    UI.conectarBarra({
      escuchar:() => Voz.hablar(titulo === 'LETRAS' ? 'la letra ' + ch : 'el ' + ch),
      siguiente, menu:volverAlMenu });
    Voz.hablar(titulo === 'LETRAS' ? 'trazá la letra ' + ch : 'trazá el ' + ch);
  }

  function siguiente(){ i = (i + 1) % set.length; pintar(); }
  pintar();
}

/* ==================================================================
   REGISTRO DE JUEGOS
   ================================================================== */
const LANZAR = {
  silabas: jArmarSilabas,  crear: jCrearPalabras,
  puzzle:  jPuzzle,        memo:  jMemo,
  listen:  jListen,        match: jMatch,
  contar:  jContar,        sumar: jSumar,
  habitat: jHabitat,       vf:    jVF,
  color:   jColor,         formas:jFormas,
  letras:  () => trazar(LETRAS_DEMO,  'LETRAS'),
  numeros: () => trazar(NUMEROS_DEMO, 'NÚMEROS')
};

/* ==================================================================
   ARRANQUE
   ================================================================== */
function arrancar(){
  vista = UI.consola({ titulo:'BUSY BOOK', emoji:'🎒', volverA:'#' });
  // El ⬅️ del encabezado vuelve al panel, no sale de la página
  document.querySelector('header a').addEventListener('click', e => { e.preventDefault(); panelInicio(); });
  document.getElementById('bb-reiniciar').addEventListener('click', () => {
    if (JUEGO_ACTUAL && LANZAR[JUEGO_ACTUAL.juego]) repetir(); else panelInicio();
  });
  panelInicio();
}

pantallaPerfil();
